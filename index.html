<!DOCTYPE html>
<html lang="en-NZ" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Year 7 Social Sciences teacher site for Waiheke High School: Local government and active citizenship.">
<meta name="robots" content="noindex, nofollow">
<title>Who Runs This Place? · Teacher site</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Manrope:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
    /* The two brand colours. Change these and the whole site changes.
       whs.dark = the deep colour used for headings and the banner
       whs.gold = the accent used for rules, ticks and active states */
    if (window.tailwind) tailwind.config = {
        darkMode: 'class',
        theme: { extend: {
            colors: { whs: { dark:'#002066', gold:'#c5a059', light:'#d1e6f6', goldtext:'#8b6508' } },
            fontFamily: { display: ['"Space Grotesk"','sans-serif'] }
        }}
    }
</script>

<style>
    :root { --whs-dark-blue:#002066; --whs-gold:#c5a059; --whs-light-blue:#d1e6f6; }
    html { scroll-behavior: smooth; }
    body { font-family:'Manrope', sans-serif; transition:background-color .3s, color .3s; font-size:16.5px; line-height:1.6;
           min-height:100vh; padding-bottom:4rem; background-color:#e2e8f0; color:#0f172a; }
    html.dark body { background-color:#0f172a; color:#f1f5f9; }
    .font-mono { font-family:'JetBrains Mono', monospace; }
    h1,h2,h3,h4 { font-family:'Space Grotesk','Manrope',sans-serif; }

    .glass-card { box-shadow:0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05); transition:background-color .3s, border-color .3s; }

    .perspective-1000 { perspective:1000px; }
    .transform-style-3d { transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,.2,.2,1); }
    .backface-hidden { backface-visibility:hidden; }
    .is-flipped { transform:rotateY(180deg); }

    ::-webkit-scrollbar { height:8px; width:8px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:4px; }
    .dark ::-webkit-scrollbar-thumb { background:#475569; }

    .fade-in { animation:fadeIn .3s ease-in-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:translateY(0);} }

    /* X-Ray highlighter system */
    .show-vocab .hlt-vocab { background-color:#fef3c7; color:#92400e; font-weight:700; border-radius:.25rem; padding:.1rem .25rem; }
    .dark .show-vocab .hlt-vocab { background-color:#78350f; color:#fef3c7; }
    .show-data .hlt-data { background-color:#dbeafe; color:#1e3a8a; font-weight:700; border-radius:.25rem; padding:.1rem .25rem; }
    .dark .show-data .hlt-data { background-color:#1e3a8a; color:#dbeafe; }
    .show-process .hlt-process { background-color:#dcfce7; color:#14532d; font-weight:700; border-radius:.25rem; padding:.1rem .25rem; }
    .dark .show-process .hlt-process { background-color:#14532d; color:#dcfce7; }
    .show-persp .hlt-persp { background-color:#fce7f3; color:#831843; font-weight:700; border-radius:.25rem; padding:.1rem .25rem; }
    .dark .show-persp .hlt-persp { background-color:#831843; color:#fce7f3; }

    .mastery-track { background-color:#e2e8f0; border-radius:999px; height:.7rem; overflow:hidden; }
    .dark .mastery-track { background-color:#334155; }
    .mastery-fill { height:100%; border-radius:999px; transition:width .6s ease; }

    .toggle-btn { background:white; border-color:#cbd5e1; color:#475569; }
    .dark .toggle-btn { background:#1e293b; border-color:#475569; color:#cbd5e1; }
    .toggle-btn.active { background:#002066; border-color:#002066; color:white; }
    .dark .toggle-btn.active { background:#c5a059; border-color:#8b6508; color:#002066; }

    .filter-chip { transition:all .2s ease; }
    .filter-chip.active { background-color:var(--whs-dark-blue); color:white; border-color:var(--whs-dark-blue); }
    .dark .filter-chip.active { background-color:var(--whs-gold); color:#002066; border-color:#8b6508; }
    .data-row-hidden { display:none !important; }

    .sort-card { padding:.5rem .9rem; border-radius:.5rem; font-size:.85rem; font-weight:700; cursor:pointer; border:2px solid #cbd5e1; background:white; color:#334155; transition:all .15s; text-align:left; }
    .dark .sort-card { background:#1e293b; border-color:#475569; color:#e2e8f0; }
    .sort-card:hover { border-color:#c5a059; }
    .sort-card.picked { background:#002066; color:white; border-color:#002066; }
    .dark .sort-card.picked { background:#c5a059; color:#002066; }
    .sort-card.correct { background:#10b981; border-color:#059669; color:white; }
    .sort-card.incorrect { background:#ef4444; border-color:#dc2626; color:white; }

    .plain-english-box { border-left:4px solid #16a34a; background-color:#f0fdf4; }
    .dark .plain-english-box { background-color:rgba(22,101,52,.18); border-left-color:#4ade80; }

    .ncea-box { border-left:4px solid #7c3aed; background-color:#f5f3ff; }
    .dark .ncea-box { background-color:rgba(76,29,149,.25); border-left-color:#a78bfa; }

    .care-box { border-left:4px solid #0891b2; background-color:#ecfeff; }
    .dark .care-box { background-color:rgba(14,116,144,.22); border-left-color:#22d3ee; }

    .gloss { border-bottom:2px dotted #c5a059; cursor:help; font-weight:700; color:#8b6508; }
    .dark .gloss { color:#e9c980; }

    .nav-btn.active { background-color:#002066 !important; color:#fff !important; border-color:#002066 !important; box-shadow:0 4px 6px -1px rgba(0,0,0,.2); }
    .dark .nav-btn.active { background-color:#c5a059 !important; color:#002066 !important; border-color:#8b6508 !important; }
    #tab-teacher.active { background-color:#334155 !important; color:#fff !important; border-color:#0f172a !important; }
    .dark #tab-teacher.active { background-color:#c5a059 !important; color:#002066 !important; }
    .nav-divider { width:1px; height:26px; background:#94a3b8; opacity:.5; margin:0 .25rem; display:inline-block; }

    .view-section { display:none; }
    .view-section.block { display:block; }

    .opt-btn { text-align:left; width:100%; }
    .opt-btn.right { background:#dcfce7 !important; border-color:#16a34a !important; }
    .dark .opt-btn.right { background:rgba(22,101,52,.4) !important; }
    .opt-btn.wrong { background:#fee2e2 !important; border-color:#dc2626 !important; }
    .dark .opt-btn.wrong { background:rgba(153,27,27,.4) !important; }

    input[type=range] { accent-color:#002066; }
    .dark input[type=range] { accent-color:#c5a059; }

    /* ---- Security Council chamber ---- */
    .seat { transition:all .2s ease; cursor:pointer; border-width:2px; }
    .seat.yes { background:#dcfce7; border-color:#16a34a; }
    .dark .seat.yes { background:rgba(22,101,52,.45); border-color:#22c55e; }
    .seat.no { background:#fee2e2; border-color:#dc2626; }
    .dark .seat.no { background:rgba(153,27,27,.45); border-color:#ef4444; }
    .seat.abstain { background:#f1f5f9; border-color:#94a3b8; }
    .dark .seat.abstain { background:#1e293b; border-color:#64748b; }

    /* ---- Timeline ---- */
    .tl-rail { position:relative; padding-left:1.6rem; }
    .tl-rail::before { content:""; position:absolute; left:.45rem; top:.4rem; bottom:.4rem; width:3px; background:#cbd5e1; border-radius:2px; }
    .dark .tl-rail::before { background:#475569; }
    .tl-dot { position:absolute; left:-1.35rem; top:.65rem; width:.85rem; height:.85rem; border-radius:999px; background:#94a3b8; border:2px solid #fff; }
    .dark .tl-dot { border-color:#0f172a; }
    .tl-item.open .tl-dot, .tl-item:hover .tl-dot { background:#002066; }
    .dark .tl-item.open .tl-dot, .dark .tl-item:hover .tl-dot { background:#c5a059; }

    table.data-table th { position:sticky; top:0; }

    .tag { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:.15rem .45rem; border-radius:.25rem; }

    /* Validated chart palette — light steps pass contrast and CVD separation checks,
       dark steps are selected for the dark surface. Never more than two categorical series. */
    .mark-1 { fill:#1d5c9c; }
    .mark-2 { fill:#a8590c; }
    .dark .mark-1 { fill:#3b82f6; }
    .dark .mark-2 { fill:#bd8208; }
    .mark-mute { fill:#cbd5e1; }
    .dark .mark-mute { fill:#3f4e63; }
    .stroke-1 { stroke:#1d5c9c; fill:none; stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
    .dark .stroke-1 { stroke:#3b82f6; }
    .chart-ink { fill:#334155; }
    .dark .chart-ink { fill:#cbd5e1; }
    .chart-mute { fill:#64748b; }
    .dark .chart-mute { fill:#94a3b8; }
    .chart-grid { stroke:#e2e8f0; stroke-width:1; }
    .dark .chart-grid { stroke:#334155; }
    .chart-ref { stroke:#64748b; stroke-width:2; stroke-dasharray:5 4; }
    .dark .chart-ref { stroke:#94a3b8; }
    .bar-hit { fill:transparent; cursor:pointer; }


    /* ---- lesson navigation ---- */
    .lesson-chip { min-width:2.35rem; padding:.3rem .55rem; border-radius:.5rem; font-size:.78rem; font-weight:800;
                   font-family:'JetBrains Mono', monospace; background:#fff; color:#334155;
                   border:1px solid #cbd5e1; transition:all .15s; line-height:1.1; position:relative; }
    .dark .lesson-chip { background:#1e293b; color:#cbd5e1; border-color:#475569; }
    .lesson-chip:hover { border-color:#c5a059; color:#8b6508; }
    .dark .lesson-chip:hover { color:#c5a059; }
    .lesson-chip.seen::after { content:''; position:absolute; top:2px; right:3px; width:5px; height:5px;
                               border-radius:50%; background:#cbd5e1; }
    .dark .lesson-chip.seen::after { background:#64748b; }
    .lesson-chip.done::after { background:#16a34a; }
    .lesson-idx.done { border-color:#86efac; }
    .dark .lesson-idx.done { border-color:#166534; }
    .lesson-chip.active { background:#002066; color:#fff; border-color:#002066; box-shadow:0 3px 6px -1px rgba(0,0,0,.25); }
    .dark .lesson-chip.active { background:#c5a059; color:#002066; border-color:#8b6508; }
    .lesson-chip.active.seen::after { background:#bbf7d0; }
    .lesson-sep { display:inline-block; width:1px; height:1.1rem; background:#cbd5e1; margin:0 .25rem; }
    .dark .lesson-sep { background:#475569; }
    .lesson-step { width:1.6rem; height:1.6rem; border-radius:.4rem; font-weight:800; line-height:1;
                   background:#fff; color:#334155; border:1px solid #cbd5e1; }
    .dark .lesson-step { background:#1e293b; color:#cbd5e1; border-color:#475569; }
    .lesson-step:hover { border-color:#c5a059; }
    .lesson-idx { text-align:left; padding:.7rem .85rem; border-radius:.6rem; border:1px solid #cbd5e1;
                  background:#fff; transition:all .15s; }
    .dark .lesson-idx { background:#1e293b; border-color:#475569; }
    .lesson-idx:hover { border-color:#c5a059; transform:translateY(-1px); }
    .lesson-idx.off { opacity:.55; cursor:default; }
    .lesson-idx.off:hover { border-color:#cbd5e1; transform:none; }
    .dark .lesson-idx.off:hover { border-color:#475569; }


    /* ---- lesson slideshow ---- */
    #deck { position:fixed; inset:0; z-index:200; background:#001033; color:#fff; display:none; flex-direction:column; }
    #deck.open { display:flex; }
    #deck-stage { flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:5vh 5vw 3vh; overflow:auto; }
    #deck-bar { flex:0 0 auto; display:flex; align-items:center; gap:.6rem; padding:.55rem 1rem;
                background:#000a22; border-top:1px solid rgba(255,255,255,.12); font-size:.8rem; }
    #deck-bar .spacer { flex:1; }
    .deck-btn { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#e2e8f0;
                border-radius:.4rem; padding:.3rem .7rem; font-weight:700; font-size:.78rem; }
    .deck-btn:hover { background:rgba(255,255,255,.18); }
    .deck-btn.on { background:#c5a059; border-color:#c5a059; color:#002066; }
    #deck-lesson { color:#8fa8cf; font-weight:700; letter-spacing:.02em; }
    #deck-count { font-family:'JetBrains Mono',monospace; color:#8fa8cf; }
    #deck-progress-track { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.1); }
    #deck-progress { height:100%; background:#c5a059; transition:width .2s; }
    #deck-notes { flex:0 0 auto; max-height:26vh; overflow:auto; padding:.9rem 1.3rem; font-size:.95rem;
                  background:#fef3c7; color:#422006; border-top:3px solid #c5a059; }
    #deck-notes strong { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:.68rem;
                         text-transform:uppercase; letter-spacing:.16em; color:#8b6508; margin-right:.6rem; }

    .slide { width:100%; max-width:1650px; }
    .slide-centre { display:flex; flex-direction:column; justify-content:center; min-height:64vh; }
    .slide-light { background:#fff; color:#0f172a; border-radius:1rem; padding:clamp(1.6rem,3.6vw,3.2rem); box-shadow:0 30px 60px -20px rgba(0,0,0,.6); }
    .slide-task { border-left:.9rem solid #c5a059; }
    .s-kicker { font-family:'JetBrains Mono',monospace; font-size:clamp(.7rem,1.15vw,1rem); text-transform:uppercase;
                letter-spacing:.2em; color:#c5a059; font-weight:700; margin-bottom:.7rem; }
    .s-kicker.gold { color:#8b6508; }
    .s-title { font-size:clamp(2.1rem,5.6vw,5rem); font-weight:800; line-height:1.03; letter-spacing:-.02em; }
    .s-ask   { font-size:clamp(1.8rem,4.6vw,4rem); font-weight:800; line-height:1.1; letter-spacing:-.015em; }
    .s-h     { font-size:clamp(1.5rem,3.5vw,3rem); font-weight:800; line-height:1.12; margin-bottom:.9rem; }
    .slide-light .s-h { color:#002066; }
    .s-sub { margin-top:1.4rem; font-size:clamp(1rem,1.9vw,1.7rem); color:#d1e6f6; line-height:1.45; }
    .s-sub li { margin-bottom:.45rem; }
    .s-stat { font-family:'JetBrains Mono',monospace; font-size:clamp(3rem,9vw,7.5rem); font-weight:700; color:#c5a059; line-height:1; }
    .s-statlabel { font-size:clamp(.95rem,1.8vw,1.6rem); color:#d1e6f6; margin:.5rem 0 1.6rem; }
    .s-list { font-size:clamp(.95rem,1.75vw,1.55rem); line-height:1.5; }
    .s-list li { position:relative; padding-left:1.5em; margin-bottom:.75rem; }
    .s-list li::before { content:'\25AA'; position:absolute; left:0; color:#c5a059; }
    .slide-dark .s-list { color:#e2e8f0; }
    .s-ol { font-size:clamp(1rem,1.9vw,1.7rem); line-height:1.45; counter-reset:t; }
    .s-ol li { position:relative; padding-left:2.1em; margin-bottom:.8rem; counter-increment:t; }
    .s-ol li::before { content:counter(t); position:absolute; left:0; font-family:'JetBrains Mono',monospace;
                       font-weight:800; color:#8b6508; }
    .s-cols { display:grid; grid-template-columns:1fr 1fr; gap:clamp(1rem,2.4vw,2.2rem); }
    .s-col { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:.75rem; padding:clamp(.9rem,1.8vw,1.6rem); }
    .s-col h3 { font-size:clamp(1rem,1.75vw,1.5rem); font-weight:800; color:#002066; margin-bottom:.7rem; line-height:1.2; }
    .s-col ul { font-size:clamp(.85rem,1.4vw,1.2rem); line-height:1.45; }
    .s-col li { position:relative; padding-left:1.3em; margin-bottom:.5rem; }
    .s-col li::before { content:'\25AA'; position:absolute; left:0; color:#c5a059; }
    .s-btn { margin-top:2rem; align-self:flex-start; background:#c5a059; color:#002066; font-weight:800;
             padding:.8rem 1.6rem; border-radius:.6rem; font-size:clamp(.95rem,1.5vw,1.25rem); }
    .s-btn:hover { filter:brightness(1.08); }

    .deck-launch { font-size:.7rem; font-weight:800; padding:.3rem .6rem; border-radius:.4rem; border:1px solid #cbd5e1;
                   background:#fff; color:#334155; white-space:nowrap; }
    .dark .deck-launch { background:#1e293b; border-color:#475569; color:#cbd5e1; }
    .deck-launch:hover { border-color:#c5a059; color:#8b6508; }
    .dark .deck-launch:hover { color:#c5a059; }
    .deck-launch.primary { background:#002066; border-color:#002066; color:#fff; }
    .dark .deck-launch.primary { background:#c5a059; border-color:#8b6508; color:#002066; }


    /* ---- book work ---- */
    .bw-lesson + .bw-lesson { border-top:2px dashed #cbd5e1; padding-top:1.4rem; }
    .dark .bw-lesson + .bw-lesson { border-color:#475569; }
    .bw-row { display:grid; grid-template-columns:8.5rem 1fr; gap:1rem; align-items:start; margin-bottom:1rem; }
    .bw-row:last-child { margin-bottom:0; }
    .bw-tag { font-family:'JetBrains Mono',monospace; font-size:.62rem; text-transform:uppercase; letter-spacing:.14em;
              font-weight:700; color:#8b6508; padding-top:.32rem; }
    .dark .bw-tag { color:#c5a059; }
    .bw-title { font-weight:800; font-size:1.05rem; color:#002066; border-bottom:2px solid #c5a059; display:inline; }
    .dark .bw-title { color:#d1e6f6; }
    .bw-text { font-size:.95rem; line-height:1.55; color:#334155; }
    .dark .bw-text { color:#cbd5e1; }
    .bw-copy { background:#fffbeb; border-left:4px solid #c5a059; border-radius:0 .5rem .5rem 0; padding:.85rem 1rem .85rem 1.1rem; }
    .dark .bw-copy { background:rgba(197,160,89,.09); }
    .bw-copy ol { list-style:decimal; padding-left:1.2rem; font-size:.93rem; line-height:1.55; color:#422006; }
    .dark .bw-copy ol { color:#fde68a; }
    .bw-copy li { margin-bottom:.5rem; }
    .bw-copy li:last-child { margin-bottom:0; }
    .bw-on li { position:relative; padding-left:1.7rem; margin-bottom:.45rem; font-size:.93rem; color:#334155; line-height:1.5; }
    .dark .bw-on li { color:#cbd5e1; }
    .bw-on li::before { content:'\2610'; position:absolute; left:0; top:-.05rem; font-size:1.05rem; color:#8b6508; }
    .dark .bw-on li::before { color:#c5a059; }

    /* book-work slides */
    .s-book { display:grid; grid-template-columns:1fr 1fr; gap:clamp(1rem,2.4vw,2.2rem); margin-top:.4rem; }
    .s-book .bk { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:.75rem; padding:clamp(.9rem,1.8vw,1.5rem); }
    .s-book .bk h3 { font-family:'JetBrains Mono',monospace; font-size:clamp(.62rem,.95vw,.85rem); text-transform:uppercase;
                     letter-spacing:.16em; color:#8b6508; font-weight:700; margin-bottom:.7rem; }
    .s-book .bk p, .s-book .bk li { font-size:clamp(.9rem,1.45vw,1.25rem); line-height:1.45; color:#0f172a; }
    .s-book .bk li { position:relative; padding-left:1.6em; margin-bottom:.5rem; }
    .s-book .bk li::before { content:'\2610'; position:absolute; left:0; color:#8b6508; }
    .s-booktitle { font-size:clamp(1.1rem,2.3vw,2rem); font-weight:800; color:#002066; border-bottom:3px solid #c5a059;
                   display:inline-block; padding-bottom:.15rem; margin-bottom:1.1rem; }
    .s-copy { counter-reset:cp; }
    .s-copy li { position:relative; padding-left:2.4em; margin-bottom:1rem; counter-increment:cp;
                 font-size:clamp(1rem,1.85vw,1.65rem); line-height:1.45; }
    .s-copy li::before { content:counter(cp); position:absolute; left:0; font-family:'JetBrains Mono',monospace;
                         font-weight:800; color:#8b6508; }




    /* green is reserved for the exercise book, so neutral boxes move to navy */
    .plain-english-box { border-left-color:#002066 !important; background-color:#f1f5f9 !important; }
    .dark .plain-english-box { background-color:rgba(209,230,246,.08) !important; border-left-color:#d1e6f6 !important; }
    .aim-do { background:#eef2f7 !important; border-bottom-color:#cbd5e1 !important; }
    .aim-do strong { color:#002066 !important; }
    .dark .aim-do { background:rgba(209,230,246,.06) !important; border-bottom-color:#475569 !important; }
    .dark .aim-do strong { color:#d1e6f6 !important; }
    .glass-card .vid-wrap { max-width:860px; }
    /* ---- work modes: where the work happens ---- */
    .wm { display:inline-flex; align-items:center; gap:.35em; font-weight:800; font-size:.7rem; letter-spacing:.07em;
          text-transform:uppercase; padding:.22rem .6rem; border-radius:999px; border:2px solid; white-space:nowrap; line-height:1.2; }
    .wm-book  { background:#dcfce7; color:#14532d; border-color:#16a34a; }
    .wm-sheet { background:#ffedd5; color:#7c2d12; border-color:#ea580c; }
    .wm-site  { background:#dbeafe; color:#1e3a8a; border-color:#2563eb; }
    .wm-watch { background:#f3e8ff; color:#581c87; border-color:#9333ea; }
    .wm-talk  { background:#f1f5f9; color:#334155; border-color:#64748b; }
    .dark .wm-book  { background:#14532d; color:#dcfce7; }
    .dark .wm-sheet { background:#7c2d12; color:#ffedd5; }
    .dark .wm-site  { background:#1e3a8a; color:#dbeafe; }
    .dark .wm-watch { background:#581c87; color:#f3e8ff; }
    .dark .wm-talk  { background:#334155; color:#f1f5f9; }
    .act-mode { float:right; margin:0 0 .5rem .75rem; }

    @media (max-width:760px){ .where-grid { grid-template-columns:1fr; } }

    /* book-work card and worksheet strip take the BOOK / WORKSHEET colours */

    /* slides: a coloured band says where the work goes */
    .s-band { display:flex; align-items:center; gap:.7em; font-weight:900; letter-spacing:.08em; text-transform:uppercase;
              font-size:clamp(.9rem,1.7vw,1.45rem); color:#fff; border-radius:.6rem; padding:.5em .9em; margin-bottom:1.1rem; }
    .s-band .ico { font-size:1.35em; line-height:1; }
    .s-band .sub { font-weight:600; text-transform:none; letter-spacing:0; opacity:.92; font-size:.78em; margin-left:auto; }
    .s-band.book  { background:#15803d; } .s-band.sheet { background:#c2410c; } .s-band.site { background:#1d4ed8; }
    .s-band.watch { background:#7e22ce; } .s-band.talk  { background:#475569; }
    .slide.sm-book  { outline:.55rem solid #16a34a; outline-offset:-.55rem; }
    .slide.sm-sheet { outline:.55rem solid #ea580c; outline-offset:-.55rem; }

    .slide.sm-watch { outline:.55rem solid #9333ea; outline-offset:-.55rem; }

    .s-pill.book { background:#15803d; } .s-pill.sheet { background:#c2410c; } .s-pill.site { background:#1d4ed8; }
    .s-pill.watch { background:#7e22ce; } .s-pill.talk { background:#475569; }
    .s-where { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(.8rem,1.8vw,1.6rem); }
    .s-where .wc { border:3px solid; border-radius:.8rem; padding:clamp(.8rem,1.6vw,1.4rem); }
    .s-where .wc h3 { font-weight:900; text-transform:uppercase; letter-spacing:.06em; font-size:clamp(.85rem,1.5vw,1.3rem); margin-bottom:.6rem; }
    .s-where .wc p, .s-where .wc li { font-size:clamp(.8rem,1.3vw,1.12rem); line-height:1.42; color:#0f172a; }
    .s-where .wc li { margin-bottom:.35rem; padding-left:1.1em; position:relative; }
    .s-where .wc li::before { content:'\2610'; position:absolute; left:0; }
    .s-where .wc.book  { border-color:#16a34a; background:#f0fdf4; } .s-where .wc.book h3 { color:#15803d; }
    .s-where .wc.sheet { border-color:#ea580c; background:#fff7ed; } .s-where .wc.sheet h3 { color:#c2410c; }
    .s-where .wc.site  { border-color:#2563eb; background:#eff6ff; } .s-where .wc.site h3 { color:#1d4ed8; }
    .s-where .wc.none  { border-style:dashed; background:#f8fafc; opacity:.55; }
    #deck-modes { display:flex; gap:.35rem; }

                      border-radius:.35rem; border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.35); }
    #deck-modes .dm.on.book  { background:#16a34a; color:#fff; border-color:#16a34a; }
    #deck-modes .dm.on.sheet { background:#ea580c; color:#fff; border-color:#ea580c; }

    /* video */
    .vid-wrap { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:.75rem; overflow:hidden; }
    .vid-wrap iframe, .vid-wrap .vid-poster { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .vid-poster { display:block; cursor:pointer; background:#0f172a center/cover no-repeat; }
    .vid-poster::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45)); }
    .vid-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1; width:5.2rem; height:3.6rem;
                border-radius:1rem; background:#dc2626; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.4); }

    .vid-cap { position:absolute; left:1rem; right:1rem; bottom:.8rem; z-index:1; color:#fff; font-weight:800; font-size:.95rem; text-shadow:0 1px 4px rgba(0,0,0,.7); }
    .vid-meta { display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; margin-bottom:.8rem; font-size:.82rem; color:#475569; }
    .dark .vid-meta { color:#94a3b8; }
    .vid-link { display:inline-block; margin-top:.6rem; font-size:.82rem; font-weight:700; color:#7e22ce; text-decoration:underline; }
    .dark .vid-link { color:#d8b4fe; }
    .vid-ask { margin-top:1rem; background:#faf5ff; border-left:4px solid #9333ea; border-radius:0 .5rem .5rem 0; padding:.8rem 1rem; }
    .dark .vid-ask { background:rgba(147,51,234,.12); }

    .dark .vid-ask strong { color:#d8b4fe; }

    .dark .vid-ask ol { color:#cbd5e1; }
    .s-video { display:grid; grid-template-columns:1.55fr 1fr; gap:clamp(1rem,2.4vw,2.2rem); align-items:start; }
    @media (max-width:760px){ .s-video { grid-template-columns:1fr; } }
    .s-video .s-list { font-size:clamp(.9rem,1.5vw,1.3rem); }

    /* ---- extra resources ---- */
    .res-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(19rem, 1fr)); gap:.9rem; }
    .res-sub { font-family:'JetBrains Mono',monospace; font-size:.62rem; text-transform:uppercase; letter-spacing:.16em;
               font-weight:700; color:#8b6508; margin-bottom:.6rem; }

    .rk-data   { background:#dcfce7; color:#14532d; border-color:#86efac; }

    .dark .rk-source { background:#78350f; color:#fef3c7; border-color:#a16207; }
    .dark .rk-read   { background:#1e3a8a; color:#dbeafe; border-color:#3b82f6; }
    .dark .rk-data   { background:#14532d; color:#dcfce7; border-color:#22c55e; }
    .dark .rk-class  { background:#831843; color:#fce7f3; border-color:#db2777; }
    .dark .rk-video  { background:#4c1d95; color:#ede9fe; border-color:#8b5cf6; }
    .res-line { display:inline; }

    .res-line:hover .res-line-t { color:#8b6508; }
    .dark .res-line:hover .res-line-t { color:#c5a059; }


    /* ---- worksheet call-out ---- */
    .ws-strip { display:flex; flex-wrap:wrap; align-items:center; gap:.9rem; padding:.9rem 1.2rem; border-radius:.7rem;
                border:2px dashed #c5a059; background:#fffbeb; }

    .ws-strip .ws-ico { font-size:1.6rem; line-height:1; }

    .dark .ws-strip .ws-t { color:#d1e6f6; }

    .dark .ws-strip .ws-d { color:#94a3b8; }

    /* ---- teacher sub-navigation ---- */
    .tnav { display:flex; flex-wrap:wrap; align-items:stretch; gap:.5rem; padding-bottom:.7rem;
            border-bottom:2px solid #cbd5e1; margin-bottom:1.25rem; }
    .dark .tnav { border-bottom-color:#334155; }
    .tnav-primary { display:flex; align-items:center; gap:.7rem; text-align:left; padding:.7rem 1.1rem;
        border-radius:.65rem; border:2px solid #cbd5e1; background:#fff; color:#334155;
        font-family:'Space Grotesk','Manrope',sans-serif; transition:all .15s; box-shadow:0 1px 3px rgba(0,0,0,.07); }
    .dark .tnav-primary { background:#1e293b; border-color:#475569; color:#e2e8f0; }
    .tnav-primary:hover { border-color:#c5a059; }
    .tnav-primary .ico { font-size:1.45rem; line-height:1; flex:none; }

    .tnav-primary .sub { display:block; font-size:.68rem; font-weight:600; opacity:.65; margin-top:.1rem; }
    .tnav-primary.active { background:#002066; border-color:#002066; color:#fff; box-shadow:0 4px 10px -2px rgba(0,32,102,.45); }
    .tnav-primary.active .sub { color:#c5a059; opacity:1; }

                                font-size:.85rem; background:#fff; color:#0f172a; border:1px solid #cbd5e1; max-width:22rem; }
        .dark .lesson-picker select { background:#1e293b; color:#e2e8f0; border-color:#475569; }
        .lesson-step { width:2.75rem; height:2.75rem; font-size:1.1rem; }
        #lesson-navblock { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.55rem; }
        #lesson-navblock > div:first-child { margin-bottom:0 !important; }
    }

    /* ---- one box for aims and task ---- */
    .aim-box { margin-top:.9rem; border-radius:.6rem; border:1px solid #cbd5e1; background:#f8fafc; overflow:hidden; }
    .dark .aim-box { border-color:#475569; background:#0f172a; }
    .aim-do { padding:.85rem 1.05rem; background:#f0fdf4; border-bottom:1px solid #bbf7d0; }
    .dark .aim-do { background:rgba(22,163,74,.09); border-bottom-color:#14532d; }
    .aim-do strong { display:block; font-size:.76rem; text-transform:uppercase; letter-spacing:.09em;
                     color:#14532d; margin-bottom:.2rem; }
    .dark .aim-do strong { color:#86efac; }
    .aim-rest { padding:.85rem 1.05rem; }
    .aim-rest .int-line { font-size:.93rem; }
    .aim-rest .int-crit { margin-top:.5rem; }

    /* ---- collapsible book work ---- */
    .bw-toggle { font-size:.68rem; font-weight:800; padding:.28rem .6rem; border-radius:.35rem;
                 border:1px solid #cbd5e1; background:#fff; color:#475569; white-space:nowrap; }
    .dark .bw-toggle { background:#1e293b; border-color:#475569; color:#cbd5e1; }
    .bw-toggle:hover { border-color:#c5a059; color:#8b6508; }
    .bw-collapsed .bw-body { display:none; }

    /* ---- one badge system: book-work row labels become plain text ---- */
    .bw-tag { font-family:inherit; font-size:.8rem; text-transform:none; letter-spacing:0;
              font-weight:700; color:#475569; padding-top:.15rem; }
    .dark .bw-tag { color:#94a3b8; }

    @media print {
        .no-print { display:none !important; }
        .tpane { display:block !important; }
        .tnav { display:none !important; }
        #deck { display:none !important; }
        .view-section { display:none !important; }
        .view-section.block { display:block !important; }
        body { font-size:11.5px; background:#fff !important; color:#000 !important; }
        .glass-card { box-shadow:none; border:1px solid #999; page-break-inside:avoid; }
        .bw-copy { background:#f7f7f7 !important; }
        .bw-row { grid-template-columns:7rem 1fr; }
    }

    /* ================= activity library ================= */
    .act-prompt { font-size:.9rem; font-weight:700; color:#002066; margin-bottom:.9rem; }
    .dark .act-prompt { color:#d1e6f6; }
    .act-bullets { list-style:none; margin:.4rem 0; }
    .act-bullets li { position:relative; padding-left:1.4rem; margin-bottom:.45rem; font-size:.92rem;
                      line-height:1.55; color:#334155; }
    .dark .act-bullets li { color:#cbd5e1; }
    .act-bullets li::before { content:'\25AA'; position:absolute; left:.25rem; color:#c5a059; font-weight:900; }
    .act-quote { border-left:4px solid #c5a059; padding:.6rem 0 .6rem 1rem; margin:.9rem 0;
                 font-style:italic; color:#334155; font-size:.95rem; line-height:1.6; }
    .dark .act-quote { color:#cbd5e1; }
    .act-quote footer { font-style:normal; font-size:.78rem; color:#64748b; margin-top:.4rem; }
    .act-bar { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; margin-top:1.1rem; }
    .act-check { background:#002066; color:#fff; font-weight:800; font-size:.8rem; padding:.55rem 1.1rem;
                 border-radius:.5rem; min-height:2.5rem; transition:background .2s; }
    .act-check:hover { background:#00307f; }
    .dark .act-check { background:#c5a059; color:#002066; }
    .act-reset { font-size:.75rem; font-weight:700; padding:.5rem .9rem; border-radius:.5rem; min-height:2.5rem;
                 border:1px solid #cbd5e1; color:#475569; background:#fff; }
    .dark .act-reset { background:#1e293b; border-color:#475569; color:#cbd5e1; }
    .act-msg { font-size:.82rem; font-weight:700; color:#64748b; }
    .act-msg.good { color:#15803d; } .dark .act-msg.good { color:#4ade80; }
    .act-msg.bad  { color:#b91c1c; } .dark .act-msg.bad  { color:#f87171; }
    .act-why { font-size:.82rem; color:#475569; margin-top:.5rem; line-height:1.5; }
    .dark .act-why { color:#94a3b8; }

    /* reveal */
    .act-reveal { display:grid; grid-template-columns:repeat(auto-fit, minmax(15rem,1fr)); gap:.8rem; }
    .rv-card { text-align:left; padding:.9rem 1rem; border-radius:.6rem; border:1px solid #cbd5e1;
               background:#f8fafc; transition:border-color .2s; }
    .dark .rv-card { background:#0f172a; border-color:#475569; }
    .rv-card:hover { border-color:#c5a059; }
    .rv-t { display:block; font-weight:800; font-size:.95rem; color:#002066; line-height:1.3; }
    .dark .rv-t { color:#d1e6f6; }
    .rv-t::after { content:' \25BE'; color:#8b6508; font-size:.8rem; }
    .rv-card.open .rv-t::after { content:' \25B4'; }
    .rv-d { display:none; font-size:.87rem; line-height:1.55; color:#475569; margin-top:.5rem; }
    .dark .rv-d { color:#94a3b8; }
    .rv-card.open .rv-d { display:block; }

    /* compare */
    .cmp-rows { display:grid; grid-template-columns:9rem 1fr; gap:.5rem .9rem; font-size:.88rem; }
    .cmp-rows dt { font-family:'JetBrains Mono',monospace; font-size:.65rem; text-transform:uppercase;
                   letter-spacing:.11em; color:#8b6508; font-weight:700; padding-top:.15rem; }
    .dark .cmp-rows dt { color:#c5a059; }
    .cmp-rows dd { color:#334155; line-height:1.5; }
    .dark .cmp-rows dd { color:#cbd5e1; }
    @media (max-width:640px) { .cmp-rows { grid-template-columns:1fr; gap:.15rem; }
        .cmp-rows dd { margin-bottom:.6rem; } }

    /* sort */
    .sort-row { display:grid; grid-template-columns:1fr auto; gap:.8rem; align-items:center;
                padding:.6rem .8rem; border-radius:.55rem; border:1px solid #e2e8f0; background:#f8fafc; }
    .dark .sort-row { background:#0f172a; border-color:#334155; }
    .sort-row.right { border-color:#16a34a; background:#f0fdf4; }
    .dark .sort-row.right { background:rgba(22,101,52,.22); }
    .sort-row.wrong { border-color:#dc2626; background:#fef2f2; }
    .dark .sort-row.wrong { background:rgba(153,27,27,.22); }
    .sort-text { font-size:.9rem; line-height:1.45; color:#334155; }
    .dark .sort-text { color:#cbd5e1; }
    .sort-bins { display:flex; gap:.4rem; flex-wrap:wrap; }
    .sort-why { grid-column:1/-1; font-size:.8rem; color:#475569; line-height:1.45; }
    .dark .sort-why { color:#94a3b8; }
    @media (max-width:640px) { .sort-row { grid-template-columns:1fr; } }

    /* match */
    .act-match { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
    .mt-col { display:flex; flex-direction:column; gap:.5rem; }
    .mt-term, .mt-def { text-align:left; padding:.6rem .8rem; border-radius:.5rem; border:2px solid #cbd5e1;
                        background:#fff; font-size:.85rem; line-height:1.4; color:#334155; min-height:2.75rem; }
    .dark .mt-term, .dark .mt-def { background:#1e293b; border-color:#475569; color:#e2e8f0; }
    .mt-term.picked { border-color:#c5a059; background:#fffbeb; }
    .dark .mt-term.picked { background:rgba(197,160,89,.18); }
    .mt-term.right { border-color:#16a34a; } .mt-term.wrong { border-color:#dc2626; }
    .mt-num { font-family:'JetBrains Mono',monospace; font-weight:800; color:#8b6508; margin-right:.4rem; }
    .dark .mt-num { color:#c5a059; }
    @media (max-width:640px) { .act-match { grid-template-columns:1fr; } }

    /* timeline build */
    .tl-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:.5rem; }
    .tl-y { font-family:'JetBrains Mono',monospace; font-weight:800; color:#8b6508; font-size:.85rem; }
    .dark .tl-y { color:#c5a059; }
    .tl-t { font-weight:700; font-size:.95rem; color:#002066; }
    .dark .tl-t { color:#d1e6f6; }
    .tl-d { font-size:.87rem; line-height:1.55; color:#475569; margin-top:.4rem; }
    .dark .tl-d { color:#94a3b8; }
    .tl-build { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .tl-pool { display:flex; flex-direction:column; gap:.45rem; }
    .tl-built { list-style:decimal; padding-left:1.4rem; display:flex; flex-direction:column; gap:.45rem; }
    .tl-built li { font-size:.85rem; padding:.45rem .6rem; border-radius:.45rem; border:1px solid #cbd5e1;
                   background:#f8fafc; color:#334155; }
    .dark .tl-built li { background:#0f172a; border-color:#475569; color:#cbd5e1; }
    .tl-built li.right { border-color:#16a34a; } .tl-built li.wrong { border-color:#dc2626; }
    .tl-x { float:right; font-weight:900; color:#94a3b8; padding:0 .3rem; }
    @media (max-width:640px) { .tl-build { grid-template-columns:1fr; } }

    /* scale */
    .scale-ends { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace;
                  font-size:.62rem; text-transform:uppercase; letter-spacing:.13em; color:#8b6508;
                  font-weight:700; margin-bottom:.6rem; }
    .dark .scale-ends { color:#c5a059; }
    .sc-row { display:grid; grid-template-columns:1fr auto; gap:.8rem; align-items:center;
              padding:.55rem .75rem; border-radius:.5rem; background:#f8fafc; border:1px solid #e2e8f0; }
    .dark .sc-row { background:#0f172a; border-color:#334155; }
    .sc-t { font-size:.89rem; line-height:1.45; color:#334155; }
    .dark .sc-t { color:#cbd5e1; }
    .sc-dots { display:flex; gap:.35rem; }
    .sc-dot { width:1.55rem; height:1.55rem; border-radius:999px; border:2px solid #cbd5e1; background:#fff; }
    .dark .sc-dot { background:#1e293b; border-color:#475569; }
    .sc-dot.on { background:#c5a059; border-color:#8b6508; }
    .sc-why { grid-column:1/-1; font-size:.8rem; color:#475569; line-height:1.45; }
    .dark .sc-why { color:#94a3b8; }

    /* rank */
    .rk-table { width:100%; border-collapse:collapse; font-size:.85rem; }
    .rk-table th, .rk-table td { padding:.5rem .6rem; border-bottom:1px solid #e2e8f0; text-align:center; }
    .dark .rk-table th, .dark .rk-table td { border-color:#334155; }
    .rk-table th { font-family:'JetBrains Mono',monospace; font-size:.66rem; text-transform:uppercase;
                   letter-spacing:.1em; color:#8b6508; }
    .dark .rk-table th { color:#c5a059; }
    .rk-c { text-align:left !important; color:#334155; }
    .dark .rk-c { color:#cbd5e1; }
    .rk-hint { display:block; font-size:.72rem; color:#94a3b8; font-weight:400; }
    .rk-b { width:1.85rem; height:1.85rem; border-radius:.4rem; border:2px solid #cbd5e1; background:#fff;
            font-weight:800; font-size:.78rem; color:#475569; margin:0 .1rem; }
    .dark .rk-b { background:#1e293b; border-color:#475569; color:#cbd5e1; }
    .rk-b.on { background:#c5a059; border-color:#8b6508; color:#002066; }
    .rk-tot td { font-family:'JetBrains Mono',monospace; font-weight:800; color:#002066; font-size:1rem; }
    .dark .rk-tot td { color:#c5a059; }
    .rk-frame:not(:empty) { margin-top:.9rem; padding:.7rem .9rem; border-radius:.5rem; font-size:.88rem;
                            background:#fffbeb; border-left:4px solid #c5a059; color:#422006; }
    .dark .rk-frame:not(:empty) { background:rgba(197,160,89,.12); color:#fde68a; }

    /* source */
    .src-mlabel { font-size:.75rem; font-weight:700; color:#64748b; align-self:center; margin-right:.2rem; }
    .src-mode { font-size:.75rem; font-weight:800; padding:.4rem .75rem; border-radius:.45rem; min-height:2.3rem;
                border:2px solid #cbd5e1; background:#fff; color:#475569; }
    .dark .src-mode { background:#1e293b; border-color:#475569; color:#cbd5e1; }
    .src-mode.active { border-color:#002066; background:#002066; color:#fff; }
    .dark .src-mode.active { background:#c5a059; border-color:#8b6508; color:#002066; }
    .src-body { padding:1rem 1.15rem; border-radius:.6rem; background:#f8fafc; border:1px solid #e2e8f0; }
    .dark .src-body { background:#0f172a; border-color:#334155; }
    .src-meta { font-family:'JetBrains Mono',monospace; font-size:.66rem; text-transform:uppercase;
                letter-spacing:.12em; color:#8b6508; margin-bottom:.6rem; }
    .dark .src-meta { color:#c5a059; }
    .src-text { font-size:.95rem; line-height:1.85; color:#334155; }
    .dark .src-text { color:#cbd5e1; }
    .src-s { cursor:pointer; border-radius:.2rem; padding:.05rem .1rem; transition:background .15s; }
    .src-s:hover { background:#e2e8f0; } .dark .src-s:hover { background:#1e293b; }
    .src-s.sm-fact,    .src-mode.sm-fact.active    { background:#dbeafe; color:#1e3a8a; }
    .src-s.sm-opinion, .src-mode.sm-opinion.active { background:#fce7f3; color:#831843; }
    .src-s.sm-evidence,.src-mode.sm-evidence.active{ background:#dcfce7; color:#14532d; }
    .src-s.sm-loaded,  .src-mode.sm-loaded.active  { background:#fef3c7; color:#92400e; }
    .src-s.ok { box-shadow:inset 0 -3px 0 #16a34a; }
    .src-s.no { box-shadow:inset 0 -3px 0 #dc2626; }

    /* decide */
    .dc-brief:not(:empty) { font-size:.88rem; line-height:1.55; color:#334155; padding:.7rem .9rem;
                            border-radius:.5rem; background:#f1f5f9; margin-bottom:1rem; }
    .dark .dc-brief:not(:empty) { background:#0f172a; color:#cbd5e1; }
    .dc-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(11rem,1fr)); gap:.6rem; }
    .dc-power { font-family:'JetBrains Mono',monospace; font-size:.55rem; text-transform:uppercase;
                letter-spacing:.1em; color:#8b6508; border:1px solid #c5a059; border-radius:.25rem;
                padding:0 .25rem; vertical-align:middle; }
    .dc-res { margin-top:1rem; padding:.8rem 1rem; border-radius:.5rem; font-size:.9rem; line-height:1.55;
              border-left:5px solid #94a3b8; background:#f1f5f9; color:#334155; }
    .dark .dc-res { background:#0f172a; color:#cbd5e1; }
    .dc-res.pass { border-left-color:#16a34a; } .dc-res.fail { border-left-color:#f59e0b; }
    .dc-res.veto { border-left-color:#dc2626; }

    /* chart */
    .chart-wrap { background:#f8fafc; border:1px solid #e2e8f0; border-radius:.6rem; padding:1rem; }
    .dark .chart-wrap { background:#0f172a; border-color:#334155; }
    .chart-cap { font-size:.8rem; color:#64748b; margin-top:.5rem; text-align:center; }
    .chart-src { font-size:.72rem; color:#94a3b8; margin-top:.35rem; }

    /* forum */
    .fr-lab { display:block; font-family:'JetBrains Mono',monospace; font-size:.6rem; text-transform:uppercase;
              letter-spacing:.13em; color:#8b6508; font-weight:700; margin-bottom:.25rem; }
    .dark .fr-lab { color:#c5a059; }
    .fr-clause { display:flex; gap:.7rem; width:100%; text-align:left; padding:.6rem .8rem; border-radius:.5rem;
                 border:1px solid #cbd5e1; background:#fff; }
    .dark .fr-clause { background:#1e293b; border-color:#475569; }
    .fr-clause.on { border-color:#16a34a; background:#f0fdf4; }
    .dark .fr-clause.on { background:rgba(22,101,52,.2); }
    .fr-box { flex-shrink:0; width:1.35rem; height:1.35rem; border-radius:.3rem; border:2px solid #94a3b8;
              display:flex; align-items:center; justify-content:center; font-weight:900; color:#16a34a; }
    .fr-ct { display:block; font-size:.88rem; line-height:1.45; color:#334155; }
    .dark .fr-ct { color:#cbd5e1; }
    .fr-by { display:block; font-size:.72rem; color:#94a3b8; margin-top:.15rem; }
    .fr-sup { margin-top:.9rem; }
    .fr-count { display:block; font-size:.75rem; color:#64748b; margin-top:.3rem; }
    .fr-text { white-space:pre-wrap; font-family:'JetBrains Mono',monospace; font-size:.78rem; line-height:1.6;
               background:#0f172a; color:#e2e8f0; border-radius:.5rem; padding:.9rem 1rem; margin-top:.9rem; }

    /* the teacher-area chrome the shell no longer carries inline */
    .nav-flag { display:inline-block; margin-left:.4rem; font-size:.55rem; font-weight:800; text-transform:uppercase;
                letter-spacing:.06em; background:#dc2626; color:#fff; padding:.1rem .35rem; border-radius:999px; }
    .nav-ico { margin-right:.15rem; }
    .tsec-prose p { margin-bottom:.7rem; line-height:1.6; }
    .tsec-prose ul { list-style:disc; padding-left:1.2rem; margin-bottom:.7rem; }
    .tsec-prose li { margin-bottom:.35rem; line-height:1.55; }
/* ===================================================================
   In-lesson phase tabs  (porting guide §5, §6)
   =================================================================== */
.ltabs{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;
  background:#fbf4e6;border:1px solid #e3cda2;border-radius:.85rem;
  padding:.5rem .6rem;margin-bottom:1.25rem}
.dark .ltabs{background:rgba(139,101,8,.18);border-color:#8b6508}
.ltabs-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;color:#8b6508;margin-right:.3rem;white-space:nowrap}
.dark .ltabs-label{color:#e3cda2}

.ltab{display:inline-flex;align-items:center;gap:.45rem;border:1.5px solid transparent;
  background:transparent;color:#334155;font-weight:700;font-size:.82rem;line-height:1.1;
  padding:.5rem .7rem;border-radius:.6rem;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  min-height:40px}
.dark .ltab{color:#cbd5e1}
.ltab:hover{background:rgba(0,0,0,.05)}
.dark .ltab:hover{background:rgba(255,255,255,.07)}
.ltab .ltab-n{display:inline-flex;align-items:center;justify-content:center;
  width:1.45rem;height:1.45rem;border-radius:.4rem;font-family:'JetBrains Mono',monospace;
  font-size:.72rem;font-weight:800;flex-shrink:0}
.ltab .ltab-ico{font-size:.8rem;letter-spacing:-.05em}

/* resting: colour lives on the number chip only */
.ltab.start .ltab-n{background:#e2e8f0;color:#334155}
.ltab.book  .ltab-n{background:#d8f3e0;color:#14532d}
.ltab.notes .ltab-n{background:#d8f3e0;color:#14532d}
.ltab.learn .ltab-n{background:#f0e2fc;color:#6b21a8}
.ltab.do    .ltab-n{background:#dbe3f2;color:#002066}
.ltab.deeper .ltab-n{background:#f6ecd5;color:#8b6508}
.dark .ltab.start .ltab-n{background:#334155;color:#e2e8f0}
.dark .ltab.book .ltab-n,.dark .ltab.notes .ltab-n{background:#14532d;color:#86efac}
.dark .ltab.learn .ltab-n{background:#4c1d95;color:#e9d5ff}
.dark .ltab.do   .ltab-n{background:#1e3a8a;color:#bfdbfe}
.dark .ltab.deeper .ltab-n{background:#6b4d06;color:#f6ecd5}

/* open: the whole tab fills */
.ltab.on{color:#fff;border-color:transparent}
.ltab.start.on {background:#475569}
.ltab.book.on,.ltab.notes.on{background:#15803d}
.ltab.learn.on {background:#6b21a8}
.ltab.do.on    {background:#002066}
.ltab.deeper.on{background:#8b6508}
.ltab.on .ltab-n{background:rgba(255,255,255,.22);color:#fff}
.dark .ltab.on{color:#fff}

.ltab-arrow{display:inline-flex;align-items:center;color:#15803d;flex-shrink:0}
.dark .ltab-arrow{color:#4ade80}
.ltab-arrow svg{width:26px;height:15px;display:block}

.lphase{display:none}
.lphase.on{display:block}
.lphase>*+*{margin-top:2rem}

.lnext{display:flex;justify-content:flex-end;margin-top:1.75rem}
.lnext button{display:inline-flex;align-items:center;gap:.5rem;color:#fff;font-weight:800;
  font-size:.9rem;padding:.7rem 1.1rem;border-radius:.7rem;border:none;cursor:pointer;
  min-height:44px;transition:filter .15s}
.lnext button:hover{filter:brightness(1.12)}
.lnext button.start {background:#475569}
.lnext button.book,.lnext button.notes{background:#15803d}
.lnext button.learn {background:#6b21a8}
.lnext button.do    {background:#002066}
.lnext button.deeper{background:#8b6508}

@media (max-width:620px){
  .ltab-arrow,.ltabs-label{display:none}
  .ltabs{gap:.3rem}
  .ltab{font-size:.78rem;padding:.45rem .55rem}
}
@media print{
  .lphase{display:block !important}
  .ltabs,.lnext{display:none !important}
  .lphase>*+*{margin-top:1.2rem}
}

/* the slim lesson identity bar that stays above the strip */
.lhead-bar{display:flex;align-items:baseline;gap:.85rem;flex-wrap:wrap;
  padding:0 .1rem .75rem;border-bottom:2px solid #e3cda2;margin-bottom:1.1rem}
.dark .lhead-bar{border-bottom-color:#8b6508}
.lhead-n{font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:900;
  color:#002066;line-height:1}
.dark .lhead-n{color:#c5a059}
.lhead-strand{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;color:#8b6508}
.dark .lhead-strand{color:#c5a059}
.lhead-title{font-size:1.45rem;font-weight:800;color:#002066;line-height:1.15;margin:0}
.dark .lhead-title{color:#d1e6f6}
@media (min-width:768px){.lhead-title{font-size:1.75rem}}

/* ===================================================================
   Reading type  (porting guide §7)
   The engine's prose does not hang off Tailwind's text-sm — it sits in
   unclassed <p>/<li> inside custom cards, each with its own rem size.
   So the floor is set on the lesson body and the exemptions named.
   =================================================================== */

#view-lesson .act-prompt, #view-lesson .where-tile p{font-size:1rem;line-height:1.6}

/* captions, sources and anything inside a control keep their own scale */

#view-lesson .res-card p, #view-lesson .res-card li,
#view-lesson table p, #view-lesson table li, #view-lesson .data-table,
#view-lesson .data-table *, #view-lesson button, #view-lesson button p,
#view-lesson .deck-launch, #view-lesson .act-btn, #view-lesson .act-check,
#view-lesson .sort-card, #view-lesson .sort-card p,

/* nothing in the lesson body goes under 11px */
#view-lesson .res-org, #view-lesson .res-kind, #view-lesson .tag,
#view-lesson .ltag, #view-lesson dt, #view-lesson th,
.lhead-strand, .ltabs-label, #view-lesson .text-\[10px\]{font-size:.72rem;letter-spacing:.1em}

/* every control keeps a 40px target */

#view-lesson .deck-launch{min-height:40px;display:inline-flex;align-items:center;justify-content:center}

/* ===================================================================

<script>
/* =========================================================================
   SITE — everything school- and unit-specific that is NOT lesson content.
   Change these values and the whole site re-brands: banner, worksheets,
   printables, PowerPoint exports and file names.
   This is the TEACHER edition: there is no passcode and no student view.
   ========================================================================= */
var SITE = {
 "school": "Waiheke High School",
 "schoolShort": "WHS",
 "year": "Year 7",
 "subject": "Social Sciences",
 "strand": "Civics",
 "unitTitle": "Local government and active citizenship",
 "unitBanner": "Who Runs This Place?",
 "unitBlurb": "16 lessons (12 core + 4 assessment) · Term 3 · 60-minute lessons",
 "lessonMinutes": 60,
 "version": "v1.0",
 "planName": "WHS Year 7 Civics unit plan (2027)",
 "overview": "Students explore how democracies function at a local level by investigating local government, community engagement, and civic responsibility. They will learn to process information, recognise perspectives, and design social action.",
 "purpose": "To empower students to become informed, active citizens who understand how local decisions are made and how they can participate meaningfully in their communities to enact change.",
 "resChecked": "October 2026",
 "fileStem": "WHS-Y7-Civics",
 "digital": {
  "head": "Type in the Google Doc, then turn it in",
  "slide": "Type your answers into the Google Doc, then turn it in on Google Classroom. Working on paper? Glue it into your book."
 },
 "ns": "whs_y7civics2027_teacher"
};
</script>
<script>
/* =========================================================================
   ENGINE — teacher edition
   Same look, same data shape and the same slideshow / worksheet / PowerPoint
   machinery as the student unit sites, with the student side taken out:
   no passcode, no progress tracking, no on-site activities. Every lesson
   page is a run sheet for the teacher.
   Nothing below needs to change when the unit content changes.
   ========================================================================= */
var STORAGE = {
    dark:   SITE.ns + '_dark',   taught: SITE.ns + '_taught',
    prep:   SITE.ns + '_prep',   lnote:  SITE.ns + '_lnote',
    pane:   SITE.ns + '_pane',   eval:   SITE.ns + '_eval',
    field:  SITE.ns + '_field',  last:   SITE.ns + '_last',
    tname:  SITE.ns + '_tname',  teams:  SITE.ns + '_teams'
};
var RES_CHECKED = SITE.resChecked;

function siteKicker(){ return SITE.school + ' · ' + SITE.year + ' ' + SITE.subject; }
function siteFile(rest){ return SITE.fileStem + '-' + rest; }
function pad2(n){ return n < 10 ? '0' + n : String(n); }

function ls(k, f) { try { var v = localStorage.getItem(k); return v === null ? f : v; } catch (e) { return f; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function jget(k, f) { try { return JSON.parse(ls(k, JSON.stringify(f))); } catch (e) { return f; } }
function jset(k, v) { lsSet(k, JSON.stringify(v)); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id) { return document.getElementById(id); }
function strip(s){ return String(s === undefined || s === null ? '' : s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&middot;/g,'·').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); }

var notifyTimer = null;
function showNotification(msg, colour) {
    var el = $('notification'); if (!el) return;
    el.textContent = msg;
    el.className = 'fixed bottom-6 right-6 z-[300] px-5 py-3 rounded-lg shadow-2xl font-bold text-sm text-white no-print ' + (colour || 'bg-whs-dark dark:bg-whs-gold dark:text-whs-dark');
    clearTimeout(notifyTimer);
    notifyTimer = setTimeout(function(){ el.className = 'fixed bottom-6 right-6 z-[300] hidden px-5 py-3 rounded-lg shadow-2xl font-bold text-sm text-white no-print'; }, 3200);
}

function initDarkMode() {
    var stored = ls(STORAGE.dark, null), on;
    if (stored === null) {
        var host = document.documentElement.getAttribute('data-theme');
        on = host ? (host === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    } else { on = stored === '1'; }
    document.documentElement.classList.toggle('dark', !!on);
}
function toggleDarkMode() {
    var on = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', on);
    lsSet(STORAGE.dark, on ? '1' : '0');
}
function toggleAccordion(id){ var el = $(id); if (el) el.classList.toggle('hidden'); }

/* ---------- unit lookups ---------- */
var LESSONS = [], LESSON_META = {}, LESSON_TAGS = {}, BOOKWORK = {}, WORKSHEETS = {}, CARDS = {},
    RESOURCES = {}, RES_NOTE = {}, SLIDES = {}, TIMING = {}, PREP = {}, TNOTES = {}, FIGS = {},
    GLOSSARY = {}, DB_ROWS = [], STRAND_LABEL = {}, DOCS = {}, CURRENT_LESSON = null, CURRENT_VIEW = 'start';

var PHASES = [
    { k:'c', label:'Connect', cls:'ph-c', field:'c' },
    { k:'i', label:'I Do',    cls:'ph-i', field:'i' },
    { k:'w', label:'We Do',   cls:'ph-w', field:'w' },
    { k:'y', label:'You Do',  cls:'ph-y', field:'y' },
    { k:'r', label:'Review',  cls:'ph-r', field:'r' }
];
var PHASE_BY = {}; PHASES.forEach(function(p){ PHASE_BY[p.k] = p; });

function lessonOf(n){ return LESSONS[Number(n) - 1]; }
function lessonTitle(n){ var l = lessonOf(n); return l ? l.t : ('Lesson ' + n); }
function bookTitleFor(n){ return 'Lesson ' + n + ' — ' + lessonTitle(n); }
function hasWorksheet(n){ return !!WORKSHEETS[n]; }
/* where a finished worksheet goes — said the same way on the sheet, the slides and the run sheet */
function wsTwoSided(w){ return /double-sided/i.test((w && w.print) || ''); }
function wsAfter(w, kind){
    if (w.after) return w.after[kind] || w.after.where;
    if (w.digital) return kind === 'head' ? SITE.digital.head : SITE.digital.slide;
    if (w.collect) return kind === 'head' ? 'Hand this in at the end' : (kind === 'slide' ? 'Name on the top. Hand it in at the end of the lesson.' : 'Hand it in at the end of the lesson.');
    if (wsTwoSided(w)) return kind === 'head' ? 'Glue in along one edge when finished' : 'Glue it into your book along one edge, so both sides can be read.';
    return kind === 'head' ? 'Glue into your book when finished' : (kind === 'slide' ? 'Glue it into your book when you have finished it.' : 'Fill it in, then glue it into your book.');
}
function hasCards(n){ return !!CARDS[n]; }
function hasBook(n){ return !!BOOKWORK[n]; }

/* ---------- work modes: where the work happens ----------
   Green, orange and purple mean what they mean on the student sites.
   Blue used to be "on the site"; students do not use this site, so blue is
   now "on the board" — the slideshow quiz or anything the class does
   together off the projector. Teal is new: printed cards to cut up.      */
var WORK_MODE = {
    book:  { ico:'📓', label:'Exercise book', short:'Book',      sub:'Write this in your book',          hex:'15803D' },
    sheet: { ico:'📄', label:'Worksheet',     short:'Worksheet', sub:'On the worksheet',                 hex:'C2410C' },
    device:{ ico:'💻', label:'On device',     short:'Device',    sub:'On your own device',               hex:'4338CA' },
    cards: { ico:'✂️', label:'Card set',      short:'Cards',     sub:'Printed cards — in pairs or groups', hex:'0F766E' },
    board: { ico:'📺', label:'On the board',  short:'Board',     sub:'Together, off the slideshow',      hex:'1D4ED8' },
    watch: { ico:'▶️', label:'Watch',         short:'Watch',     sub:'Video — eyes on the screen',  hex:'7E22CE' },
    talk:  { ico:'🗣️', label:'Talk',    short:'Talk',      sub:'Discuss — no writing yet',    hex:'475569' },
    out:   { ico:'🧤', label:'Outside',       short:'Outside',   sub:'Fieldwork — follow the safety rules', hex:'B45309' }
};
var MODE_ORDER = ['book','sheet','device','cards','board','watch','talk','out'];
function modeSplit(x){
    var m = /^\s*(book|sheet|device|cards|board|watch|talk|out)\s*:\s*/i.exec(String(x));
    return m ? { m:m[1].toLowerCase(), t:String(x).slice(m[0].length) } : { m:null, t:String(x) };
}
function modePill(m){ var w = WORK_MODE[m]; return w ? '<span class="s-pill ' + m + '">' + w.ico + ' ' + w.short + '</span>' : ''; }
function modeChip(m){ var w = WORK_MODE[m]; return w ? '<span class="wm wm-' + m + '">' + w.ico + ' ' + w.short + '</span>' : ''; }
function modeBand(m, sub){
    var w = WORK_MODE[m]; if (!w) return '';
    return '<div class="s-band ' + m + '"><span class="ico">' + w.ico + '</span><span>' + w.label + '</span><span class="sub">' + esc(sub || w.sub) + '</span></div>';
}

/* The task slide is the master list. Everything that says "what goes where"
   — the three tiles on the lesson page, the "where your work goes" slide,
   the print-room table, the unit plan — is read off it, so they cannot
   drift apart.                                                            */
function taskSlide(n){
    var d = SLIDES[n] || [];
    for (var i = 0; i < d.length; i++) if (d[i].k === 'task') return d[i];
    return null;
}
function taskLines(n, modes){
    var t = taskSlide(n); if (!t) return [];
    return (t.body || []).map(modeSplit).filter(function(p){ return !modes || modes.indexOf(p.m) > -1; });
}
function bookAct(n){
    var w = BOOKWORK[n]; if (!w) return '';
    if (w.act) return w.act;
    var lines = taskLines(n, ['book']).map(function(p){ return p.t; });
    return 'Rule off, then write the date and the title. ' + lines.join(' ');
}

/* ---------- navigation ---------- */
var MAIN_TABS = [
    { id:'start',  label:'🧭 Start Here' },
    { id:'print',  label:'🖨️ Print Room' },
    { id:'assess', label:'📝 Assessment' },
    { id:'home',   label:'🏠 Homework' },
    { id:'facts',  label:'📊 Fact File' },
    { id:'words',  label:'🔤 Key Words' },
    { id:'about',  label:'📕 About the Unit' }
];
function renderMainNav(){
    $('main-nav').innerHTML = MAIN_TABS.map(function(t){
        var on = CURRENT_VIEW === t.id && !CURRENT_LESSON;
        return '<button id="tab-' + t.id + '" role="tab" aria-selected="' + (on ? 'true' : 'false') + '" onclick="switchTab(\'' + t.id + '\')" '
            + 'class="nav-btn' + (on ? ' active' : '') + ' px-4 py-2 text-sm rounded-lg font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all text-slate-700 dark:text-slate-200 shadow-sm">'
            + t.label + '</button>';
    }).join('');
}
function setBanner(lean){ var b = $('site-banner'); if (b) b.classList.toggle('lean', !!lean); }
function showView(id){
    document.querySelectorAll('.view-section').forEach(function(s){ s.classList.remove('block'); });
    var v = $('view-' + id); if (v) v.classList.add('block');
}
function switchTab(target) {
    if (DECK.n !== null) closeDeck();
    CURRENT_LESSON = null; CURRENT_VIEW = target;
    showView(target);
    renderMainNav(); renderLessonNav();
    setBanner(target !== 'start');
    if (target === 'start') renderStart();
    if (target === 'print') renderPrint();
    if (target === 'home') renderHome();
    window.scrollTo({ top:0, behavior:'smooth' });
    lsSet(STORAGE.last, target);
}

function taughtList(){ return jget(STORAGE.taught, []); }
function isTaught(n){ return taughtList().indexOf(Number(n)) > -1; }
function toggleTaught(n){
    n = Number(n);
    var t = taughtList(), i = t.indexOf(n);
    if (i > -1) t.splice(i, 1); else t.push(n);
    jset(STORAGE.taught, t);
    renderProgress(); renderLessonNav();
    if (CURRENT_LESSON === n) renderLessonHead(n);
    if (i < 0) showNotification('✓ Lesson ' + n + ' ticked off as taught', 'bg-green-600');
}
function nextUntaught(){
    for (var i = 0; i < LESSONS.length; i++) if (!isTaught(LESSONS[i].n)) return LESSONS[i].n;
    return null;
}
function renderProgress(){
    var done = taughtList().filter(function(n){ return !!lessonOf(n); }).length, total = LESSONS.length;
    $('progress-done').textContent = done; $('progress-total').textContent = total;
    $('progress-bar').style.width = (total ? done / total * 100 : 0) + '%';
    var nx = nextUntaught();
    $('progress-next').textContent = nx ? 'Next up: Lesson ' + nx + ' · ' + lessonTitle(nx) : 'Every lesson taught — ka pai';
}

function renderLessonNav(){
    var sel = $('lesson-select');
    if (sel) sel.innerHTML = '<option value="" disabled' + (CURRENT_LESSON ? '' : ' selected') + '>Choose a lesson …</option>'
        + LESSONS.map(function(l){
            return '<option value="' + l.n + '"' + (CURRENT_LESSON === l.n ? ' selected' : '') + '>Lesson ' + l.n + ' · ' + esc(l.t) + '</option>';
        }).join('');
    var prev = null;
    $('lesson-nav').innerHTML = LESSONS.map(function(l){
        var sep = (prev !== null && prev !== l.strand) ? '<span class="lesson-sep" aria-hidden="true"></span>' : '';
        prev = l.strand;
        return sep + '<button aria-selected="' + (CURRENT_LESSON === l.n ? 'true' : 'false') + '" onclick="switchLesson(' + l.n + ')" '
            + 'title="Lesson ' + l.n + ' · ' + esc(l.t) + (isTaught(l.n) ? ' (taught)' : '') + '" '
            + 'class="lesson-chip' + (isTaught(l.n) ? ' seen done' : '') + (CURRENT_LESSON === l.n ? ' active' : '') + '">' + l.n + '</button>';
    }).join('');
}
function lessonStep(d){
    var i = CURRENT_LESSON ? CURRENT_LESSON - 1 : -1, j = i + d;
    if (d > 0 && i < 0) j = 0;
    if (j < 0 || j >= LESSONS.length) return;
    switchLesson(LESSONS[j].n);
}

function lessonTagsHTML(n){
    return ((LESSON_META[n] || {}).tags || []).map(function(t){
        return LESSON_TAGS[t] ? '<span class="ltag ' + LESSON_TAGS[t].cls + '">' + esc(LESSON_TAGS[t].label) + '</span>' : '';
    }).join('');
}

/* small "what this lesson has" icons, used on the index and in the print room */
function lessonKit(n){
    var k = [];
    if (SLIDES[n]) k.push(['🎬', SLIDES[n].length + ' slides']);
    if (hasWorksheet(n)) k.push(['📄', 'worksheet']);
    if (hasCards(n)) k.push(['✂️', 'card set']);
    if (deckQuizCount(n)) k.push(['❓', deckQuizCount(n) + '-question slide quiz']);
    if (deckVideoCount(n)) k.push(['▶️', 'video']);
    if (hwSetIn(n)) k.push(['🏠', 'homework set']);
    return k;
}

/* ---------- devices: the plan's ON DEVICE / BOOKWORK / MIX tag ----------
   dev = { mode:'device'|'book'|'mix', tag:'the plan’s words', parts:[['book',30],['device',30]] }   */
var DEV = {
    device: { ico:'💻', label:'On device' },
    book:   { ico:'📓', label:'Bookwork' },
    mix:    { ico:'📓 💻', label:'Mix' }
};
function devSay(d){
    if (!d) return '';
    if (d.say) return d.say;
    if (d.mode === 'device') return 'Devices out today: the whole lesson is on your device.';
    if (d.mode === 'book') return 'No devices today: books only.';
    return (d.parts || []).map(function(p, i){ return (i ? 'then ' : '') + (p[0] === 'device' ? 'devices' : 'books') + ' for ' + p[1] + ' minutes'; }).join(', ').replace(/^./, function(c){ return c.toUpperCase(); }) + '.';
}
function devOf(n){ var l = lessonOf(n); return l && l.dev ? l.dev : null; }
function devTag(n){ var d = devOf(n); return d ? d.tag : ''; }
function devChip(n, small){
    var d = devOf(n); if (!d) return '';
    var parts = (d.parts || []).map(function(p){ return (p[0] === 'device' ? 'device ' : 'book ') + p[1]; }).join(' → ');
    return '<span class="dev-chip dev-' + d.mode + (small ? ' sm' : '') + '" title="' + esc(d.tag) + '">' + DEV[d.mode].ico + ' ' + DEV[d.mode].label
        + (d.mode === 'mix' && !small ? ' · ' + esc(parts) : '') + '</span>';
}
function devStripHTML(n){
    var d = devOf(n); if (!d) return '';
    var at = 0;
    return '<div class="t-devbar" aria-label="' + esc(d.tag) + '">' + (d.parts || []).map(function(p){
        var from = at; at += p[1];
        return '<span class="' + (p[0] === 'device' ? 'dv' : 'bk') + '" style="flex:' + p[1] + '">' + (p[0] === 'device' ? '💻 Devices' : '📓 Books') + ' · ' + from + '–' + at + ' min</span>';
    }).join('') + '</div>';
}
function deviceMinutes(n){ var d = devOf(n); if (!d) return 0; return (d.parts || []).reduce(function(a, p){ return a + (p[0] === 'device' ? p[1] : 0); }, 0); }
function aiChip(n){ var l = lessonOf(n); return l && l.ai ? '<span class="dev-chip dev-ai" title="' + esc(l.ai.label) + '">🤖 AI level ' + l.ai.level + ' · ' + esc(l.ai.label) + '</span>' : ''; }
function recallOf(n){ var l = lessonOf(n); return l && l.recall ? l.recall : null; }

/* ---------- homework ---------- */
var HOMEWORK = [];
function hwSetIn(n){ for (var i = 0; i < HOMEWORK.length; i++) if (HOMEWORK[i].set === Number(n)) return HOMEWORK[i]; return null; }
function hwDueIn(n){ return HOMEWORK.filter(function(h){ return h.due === Number(n); }); }
function hwChip(n){
    var s = hwSetIn(n), d = hwDueIn(n), out = '';
    if (s) out += '<span class="dev-chip dev-hw">🏠 Homework set · due Lesson ' + s.due + '</span>';
    d.forEach(function(h){ out += '<span class="dev-chip dev-hw due">🏠 Week ' + h.wk + ' homework due today</span>'; });
    return out;
}
function teacherName(){ return ls(STORAGE.tname, '') || '[Teacher name]'; }
function deckQuizCount(n){ return (SLIDES[n] || []).filter(function(s){ return s.k === 'quiz'; }).length; }
function deckVideoCount(n){ return (SLIDES[n] || []).filter(function(s){ return s.k === 'video'; }).length; }

/* ---------- Start Here ---------- */
function renderStart(){
    var prev = null, groups = [];
    LESSONS.forEach(function(l){
        if (l.strand !== prev) { groups.push({ strand:l.strand, items:[] }); prev = l.strand; }
        groups[groups.length - 1].items.push(l);
    });
    $('lesson-index').innerHTML = groups.map(function(g){
        return '<div><div class="idx-strand">' + esc(STRAND_LABEL[g.strand] || g.strand) + '</div>'
            + '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">'
            + g.items.map(function(l){
                var kit = lessonKit(l.n).map(function(k){ return '<span title="' + esc(k[1]) + '">' + k[0] + '</span>'; }).join(' ');
                return '<button onclick="switchLesson(' + l.n + ')" class="lesson-idx' + (isTaught(l.n) ? ' done' : '') + '">'
                    + '<span class="flex items-baseline gap-2 mb-0.5">'
                    +   '<span class="font-mono font-black text-whs-dark dark:text-whs-gold">' + l.n + '</span>'
                    +   lessonTagsHTML(l.n) + devChip(l.n, true)
                    +   (isTaught(l.n) ? '<span class="ml-auto text-green-600 dark:text-green-400 text-xs font-bold">✓ taught</span>' : '')
                    + '</span>'
                    + '<span class="block text-sm font-bold text-whs-dark dark:text-whs-light leading-snug">' + esc(l.t) + '</span>'
                    + '<span class="block text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">' + esc((LESSON_META[l.n] || {}).short || '') + '</span>'
                    + '<span class="block text-xs mt-1.5 opacity-80">' + kit + '</span></button>';
              }).join('')
            + '</div></div>';
    }).join('');

    var nx = nextUntaught();
    $('start-next').innerHTML = nx
        ? '<div class="glass-card rounded-xl border-2 border-whs-gold bg-white dark:bg-slate-800 p-5 flex flex-wrap items-center justify-between gap-4">'
          + '<div><div class="text-[10px] font-mono uppercase tracking-widest font-bold text-whs-goldtext dark:text-whs-gold">Your next lesson</div>'
          + '<div class="text-xl font-extrabold text-whs-dark dark:text-whs-light">Lesson ' + nx + ' · ' + esc(lessonTitle(nx)) + '</div>'
          + '<div class="text-sm text-slate-600 dark:text-slate-300 mt-1">' + esc((LESSON_META[nx] || {}).intent || '') + '</div></div>'
          + '<div class="flex flex-wrap gap-2 no-print">'
          +   '<button onclick="switchLesson(' + nx + ')" class="act-check">Open the run sheet</button>'
          +   '<button onclick="openDeck(' + nx + ')" class="act-reset">▶ Present</button>'
          +   '<button onclick="openLessonPack(' + nx + ')" class="act-reset">🖨️ Print the lesson pack</button>'
          + '</div></div>'
        : '';
}

function applyBranding(){
    var set  = function(id, t){ var el = $(id); if (el) el.textContent = t; };
    var html = function(id, t){ var el = $(id); if (el) el.innerHTML = t; };
    document.title = SITE.unitBanner + ' · Teacher site';
    set('brand-kicker', SITE.year + ' ' + SITE.subject + ' · ' + SITE.strand + ' · Teacher site');
    set('brand-title',  SITE.unitBanner);
    set('brand-sub',    UNIT.bannerSub || SITE.unitTitle);
    set('version-badge', SITE.version || 'v1.0');
    if (SITE.badge) {
        var b = $('banner-side');
        if (b) { b.classList.remove('hidden');
            set('banner-side-lab', SITE.badge.label); set('banner-side-val', SITE.badge.value);
            set('banner-side-sub', SITE.badge.note || ''); }
    }
    set('start-kicker', SITE.year + ' ' + SITE.subject + ' · ' + SITE.unitBlurb);
    set('start-title',  SITE.unitBanner);
    set('start-bigq',   UNIT.bigQuestion || '');
    html('start-lead',  UNIT.startLead || '');
    html('start-outcomes', (UNIT.outcomes || []).map(function(o, i){
        return '<li class="flex gap-3"><span class="text-whs-gold font-black">' + pad2(i + 1) + '</span><span>' + o + '</span></li>';
    }).join(''));
    html('start-warnings', (UNIT.teacherWarnings || []).map(function(p){ return '<p>' + p + '</p>'; }).join(''));
    html('start-side', (UNIT.startCards || []).map(function(c){
        var cls = c.style === 'ncea' ? 'ncea-box' : c.style === 'care' ? 'care-box' : 'plain-english-box';
        return '<div class="glass-card bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-300 dark:border-slate-700">'

            + '<div class="' + cls + ' p-4 rounded-r-lg text-sm text-slate-700 dark:text-slate-300 start-card">' + c.body + '</div></div>';
    }).join(''));

}

function hydrateUnit(){
    LESSONS     = UNIT.lessons       || [];
    LESSON_META = UNIT.meta          || {};
    LESSON_TAGS = UNIT.tags          || {};
    BOOKWORK    = UNIT.bookwork      || {};

    RESOURCES   = UNIT.resources     || {};
    RES_NOTE    = UNIT.resourceNotes || {};
    SLIDES      = UNIT.slides        || {};
    TIMING      = UNIT.timing        || {};
    PREP        = UNIT.prep          || {};
    TNOTES      = UNIT.notes         || {};
    FIGS        = UNIT.figs          || {};

}

/* Give every slide its lesson number and a phase. A slide inherits the phase
   of the one before it, so a deck only has to mark where each phase starts. */
function prepareDecks(){
    Object.keys(SLIDES).forEach(function(key){
        var n = Number(key), ph = 'c';
        SLIDES[n].forEach(function(s){
            s.ln = n;
            if (s.ph) ph = s.ph; else s.ph = ph;
        });
        var first = SLIDES[n][0];
        if (first && first.k === 'title' && !first.n) first.n = lessonPlanNotes(n);
    });
}
function lessonPlanNotes(n){
    var l = lessonOf(n); if (!l) return '';
    var tm = TIMING[n] || {}, rc = recallOf(n), hw = hwSetIn(n);
    return (l.dev ? 'DEVICES: ' + l.dev.tag + '  |  ' : '')
        + (rc ? 'RETRIEVAL (Lesson ' + rc.from + '): ' + rc.q + ' — ' + strip(rc.a) + '  |  ' : '')
        + PHASES.map(function(p){ return p.label.toUpperCase() + (tm[p.k] ? ' (' + tm[p.k] + ' min)' : '') + ': ' + l[p.field]; }).join('  |  ')
        + (hw ? '  |  HOMEWORK (Week ' + hw.wk + ', due Lesson ' + hw.due + '): ' + hw.tasks.map(strip).join(' ') : '')
        + (l.res ? '  |  PREP: ' + l.res : '');
}
/* which slides belong to which phase — printed on the run sheet */
function phaseSlides(n, k){
    var out = [];
    (SLIDES[n] || []).forEach(function(s, i){ if (s.ph === k) out.push(i + 1); });
    return out;
}
function rangeText(a){
    if (!a.length) return '—';
    var parts = [], s = a[0], p = a[0];
    for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        parts.push(s === p ? String(s) : s + '–' + p);
        s = p = a[i];
    }
    return parts.join(', ');
}

var LPANES = [
    { k:'run',    label:'Run sheet',   ico:'⏱️', cls:'start'  },

];

function switchLesson(n){
    n = Number(n);
    var l = lessonOf(n); if (!l) return;
    if (DECK.n !== null) closeDeck();
    CURRENT_LESSON = n; CURRENT_VIEW = 'lesson';
    showView('lesson');
    setBanner(true);
    renderMainNav(); renderLessonNav();

function renderLessonHead(n){

        + '<span class="lhead-n">' + n + '</span>'

}

function lessonFooterHTML(n){
    function btn(l, dir){
        if (!l) return '<span></span>';
        return '<button onclick="switchLesson(' + l.n + ')" class="glass-card bg-white dark:bg-slate-800 px-5 py-3 rounded-xl border border-slate-300 dark:border-slate-700 hover:border-whs-gold transition text-left max-w-[19rem]">'

function buildLessonPanes(n){
    var panes = LPANES.filter(function(p){
        if (p.k === 'hand') return hasWorksheet(n) || hasCards(n) || lessonDocs(n).length > 0;
        if (p.k === 'book') return hasBook(n);
        return true;
    });
    $('lesson-tabs').innerHTML = '<div class="ltabs no-print" role="tablist" aria-label="Lesson sections">'
        + '<span class="ltabs-label">Lesson ' + n + '</span>'
        + panes.map(function(p){
            return '<button type="button" class="ltab ' + p.cls + '" id="lpane-tab-' + p.k + '" role="tab" onclick="showLessonPane(\'' + p.k + '\')">'
                + '<span class="ltab-n">' + p.ico + '</span>' + esc(p.label) + '</button>';
        }).join('') + '</div>';
    $('lesson-phases').innerHTML = panes.map(function(p){
        return '<div class="lphase" id="lpane-' + p.k + '" role="tabpanel" aria-label="' + esc(p.label) + '"></div>';
    }).join('');
    var want = ls(STORAGE.pane, 'run');
    if (!$('lpane-' + want)) want = 'run';
    showLessonPane(want, true);
}

var PANE_DRAW = { run:paneRun, slides:paneSlides, hand:paneHand, book:paneBook, keys:paneKeys, links:paneLinks };
function showLessonPane(k, quiet){
    var n = CURRENT_LESSON; if (!n) return;
    LPANES.forEach(function(p){
        var pane = $('lpane-' + p.k), tab = $('lpane-tab-' + p.k);
        if (pane) pane.classList.toggle('on', p.k === k);
        if (tab) { tab.classList.toggle('on', p.k === k); tab.setAttribute('aria-selected', p.k === k ? 'true' : 'false'); }
    });
    var host = $('lpane-' + k);
    if (host && !host.getAttribute('data-drawn')) { host.innerHTML = PANE_DRAW[k](n); host.setAttribute('data-drawn', '1'); afterPane(k, n); }
    lsSet(STORAGE.pane, k);
    if (!quiet) {
        var top = $('lesson-tabs');
        if (top) window.scrollTo({ top: Math.max(0, top.getBoundingClientRect().top + window.scrollY - 130), behavior:'smooth' });
    }
}
function afterPane(k, n){
    if (k === 'run') { loadLessonNote(n); if (UNIT.fieldTool && UNIT.fieldTool.lessons.indexOf(n) > -1) drawFieldTool(); }
    if (k === 'hand') fitFrames();
    if (k === 'slides') fitThumbs();
}
function fitThumbs(){
    document.querySelectorAll('.t-thumb-frame').forEach(function(f){
        var inner = f.querySelector('.t-thumb-inner'); if (inner && f.clientWidth) inner.style.transform = 'scale(' + (f.clientWidth / 1280) + ')';
    });
}

function card(inner, cls){
    return '<div class="glass-card bg-white dark:bg-slate-800 p-5 md:p-6 rounded-xl border ' + (cls || 'border-slate-300 dark:border-slate-700') + '">' + inner + '</div>';

function kick(t){ return '<div class="text-[10px] font-mono uppercase tracking-widest text-slate-500 dark:text-slate-400 font-bold mb-2">' + t + '</div>'; }

function fieldSlideIndex(){

function saveField(i, v){ var d = fieldData(); if (v === '') delete d[i]; else d[i] = Math.max(0, Number(v) || 0); jset(STORAGE.field, d); drawFieldTool(); }
function clearField(){ jset(STORAGE.field, {}); if (CURRENT_LESSON) { var h = $('lpane-run'); if (h) { h.removeAttribute('data-drawn'); showLessonPane('run', true); } } }
function drawFieldTool(){ var el = $('field-chart'); if (el) el.innerHTML = fieldChartSVG(false); }
function fieldChartSVG(big){
    var ft = UNIT.fieldTool, d = fieldData(), vals = ft.cats.map(function(c, i){ return Number(d[i]) || 0; });
    var max = Math.max.apply(null, vals.concat([1])), total = vals.reduce(function(a, b){ return a + b; }, 0);
    var W = 760, rowH = 40, left = 230, H = ft.cats.length * rowH + 50;
    var ink = big ? '#0f172a' : 'currentColor';
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;font-family:Arial,Helvetica,sans-serif" role="img" aria-label="Bar chart of the class fieldwork tallies">';
    ft.cats.forEach(function(c, i){
        var y = 10 + i * rowH, w = Math.round((W - left - 70) * vals[i] / max);
        s += '<text x="' + (left - 10) + '" y="' + (y + 22) + '" text-anchor="end" font-size="15" fill="' + ink + '">' + esc(c) + '</text>'
           + '<rect x="' + left + '" y="' + (y + 5) + '" width="' + Math.max(w, 1) + '" height="26" rx="3" fill="#1d5c9c"/>'
           + '<text x="' + (left + Math.max(w, 1) + 8) + '" y="' + (y + 24) + '" font-size="15" font-weight="bold" fill="' + ink + '">' + vals[i] + '</text>';
    });
    s += '<text x="' + left + '" y="' + (H - 12) + '" font-size="14" fill="' + ink + '">' + (total ? 'Total items recorded: ' + total : 'No numbers typed in yet — add them on the Lesson ' + ft.lessons[0] + ' or ' + ft.lessons[ft.lessons.length - 1] + ' run sheet.') + '</text></svg>';
    return s;
}
