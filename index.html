function ytWatchURL(id, start){ return 'https://www.youtube.com/watch?v=' + id + (start ? '&t=' + start + 's' : ''); }
function vidPosterHTML(id, start, cap){
    return '<div class="vid-wrap"><a class="vid-poster" href="' + ytWatchURL(id, start) + '" target="_blank" rel="noopener"'
        + ' onclick="return vidPlay(this,\'' + id + '\',' + (start || 0) + ')"'
        + ' style="background-image:url(https://i.ytimg.com/vi/' + id + '/hqdefault.jpg)" aria-label="Play video: ' + esc(cap || '') + '">'
        + '<span class="vid-play"></span>' + (cap ? '<span class="vid-cap">' + esc(cap) + '</span>' : '') + '</a></div>';
}
function vidPlay(el, id, start){
    /* YouTube refuses to embed in a page opened straight from disk (file://). Open it on YouTube instead. */
    if (location.protocol === 'file:') return true;
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0' + (start ? '&start=' + start : '');
    f.title = 'YouTube video';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.setAttribute('allowfullscreen', '');
    el.parentNode.replaceChild(f, el);
    return false;
}

/* ---------- presenter ---------- */
function slideModes(s){
    if (s.k === 'copy') return ['book'];
    if (s.k === 'sheet' && WORKSHEETS[s.ln] && WORKSHEETS[s.ln].digital) return ['sheet','device'];
    if (s.k === 'sheet' || s.k === 'answers') return ['sheet'];
    if (s.k === 'cards') return ['cards'];
    if (s.k === 'quiz') return ['board'];
    if (s.k === 'video') return ['watch'];
    if (s.k === 'prompt') return ['device'];
    if (s.k === 'where') { var o = []; if (hasBook(s.ln)) o.push('book'); if (hasWorksheet(s.ln)) o.push('sheet'); if (deviceMinutes(s.ln)) o.push('device'); if (hasCards(s.ln)) o.push('cards'); return o; }
    if (s.k === 'task') {
        var seen = [];
        (s.body || []).forEach(function(x){ var m = modeSplit(x).m; if (m && seen.indexOf(m) < 0) seen.push(m); });
        return seen;
    }
    return [];
}
function openDeck(n, i){
    if (!SLIDES[n]) { showNotification('No slides for lesson ' + n, 'bg-slate-700'); return; }
    DECK.n = n; DECK.i = Math.max(0, Math.min(SLIDES[n].length - 1, i || 0)); DECK.step = 0;
    var d = $('deck');
    d.classList.add('open');
    document.body.style.overflow = 'hidden';
    renderDeck();
    if (d.requestFullscreen) { try { var p = d.requestFullscreen(); if (p && p.catch) p.catch(function(){}); } catch (e) {} }
}
function closeDeck(){
    dbStop();
    $('deck').classList.remove('open');
    document.body.style.overflow = '';
    DECK.n = null; deckTimerStop();
    if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch (e) {} }
}
function deckGo(i, step){
    var s = SLIDES[DECK.n]; if (!s) return;
    DECK.i = Math.max(0, Math.min(s.length - 1, i)); DECK.step = step || 0;
    renderDeck();
}
function deckNext(){
    var s = SLIDES[DECK.n][DECK.i];
    if (DECK.step < slideSteps(s) - 1) { DECK.step++; renderDeck(); return; }
    if (DECK.i < SLIDES[DECK.n].length - 1) deckGo(DECK.i + 1, 0);
}
function deckPrev(){
    if (DECK.step > 0) { DECK.step--; renderDeck(); return; }
    if (DECK.i > 0) deckGo(DECK.i - 1, 0);
}
function deckToggleNotes(){ DECK.notes = !DECK.notes; renderDeck(); }
function deckFullscreen(){
    var d = $('deck');
    if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); }
    else if (d.requestFullscreen) { try { d.requestFullscreen(); } catch (e) {} }
}
function deckPhaseMinutes(){ var s = SLIDES[DECK.n][DECK.i]; return (TIMING[DECK.n] || {})[s.ph] || 0; }
function deckTimerToggle(){
    if (DECK.timerEnd) { deckTimerStop(); renderDeck(); return; }
    var m = deckPhaseMinutes(); if (!m) return;
    DECK.timerEnd = Date.now() + m * 60000;
    DECK.timerInt = setInterval(deckTimerTick, 500);
    deckTimerTick();
}
function deckTimerStop(){ if (DECK.timerInt) clearInterval(DECK.timerInt); DECK.timerInt = null; DECK.timerEnd = null; }
function deckTimerTick(){
    var el = $('deck-timer'); if (!el || !DECK.timerEnd) return;
    var left = Math.round((DECK.timerEnd - Date.now()) / 1000);
    if (left <= 0) { el.textContent = '⏱ Time'; el.classList.add('over'); clearInterval(DECK.timerInt); DECK.timerInt = null; return; }
    el.classList.remove('over'); el.classList.add('on');
    el.textContent = '⏱ ' + Math.floor(left / 60) + ':' + pad2(left % 60);
}
function renderDeck(){
    var deck = SLIDES[DECK.n]; if (!deck) return;
    var s = deck[DECK.i], p = PHASE_BY[s.ph] || PHASES[0], m = deckPhaseMinutes();
    if (s.k !== 'debate') dbStop();
    $('deck-stage').innerHTML = slideHTML(s, false, DECK.step);
    if (s.k === 'debate') dbTick();
    var on = slideModes(s);
    $('deck-modes').innerHTML = ['book','sheet','device','cards','board','watch'].map(function(k){
        var w = WORK_MODE[k];
        return '<span class="dm ' + k + (on.indexOf(k) > -1 ? ' on' : '') + '">' + w.ico + ' ' + w.short + '</span>';
    }).join('');
    $('deck-lesson').textContent = 'Lesson ' + DECK.n + ' · ' + lessonTitle(DECK.n);
    $('deck-phase').className = 't-ph ' + p.cls; $('deck-phase').textContent = p.label + (m ? ' · ' + m + ' min' : '');
    $('deck-count').textContent = (DECK.i + 1) + ' / ' + deck.length;
    $('deck-progress').style.width = ((DECK.i + 1) / deck.length * 100) + '%';
    var nt = $('deck-notes');
    nt.classList.toggle('hidden', !DECK.notes || !s.n);
    nt.innerHTML = s.n ? '<strong>Teacher note</strong> ' + esc(s.n) : '';
    $('deck-notes-btn').classList.toggle('on', DECK.notes);
    var tb = $('deck-timer');
    if (!DECK.timerEnd) { tb.className = 'deck-btn'; tb.textContent = m ? '⏱ ' + m + ' min' : '⏱'; }
    var hint = $('deck-hint');
    if (hint) hint.textContent = DECK.step < slideSteps(s) - 1 ? 'press → to reveal' : '';
}
document.addEventListener('keydown', function(e){
    if (DECK.n === null) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); deckNext(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); deckPrev(); }
    else if (k === 'Home') { e.preventDefault(); deckGo(0); }
    else if (k === 'End') { e.preventDefault(); deckGo(SLIDES[DECK.n].length - 1); }
    else if (k === 'Escape') { if (!document.fullscreenElement) closeDeck(); }
    else if (k === 'n' || k === 'N') { deckToggleNotes(); }
    else if (k === 't' || k === 'T') { deckTimerToggle(); }
    else if (k === 'f' || k === 'F') { deckFullscreen(); }
});

/* ---------- debate clock (Lessons 14–16) ----------
   Click a speaker on the debate slide: the clock counts down their time,
   turns amber with 30 seconds left (one knock on the desk) and red at zero
   (two knocks: finish your sentence). It allows 15 seconds of grace.        */
var DBT = { end:null, int:null, who:'' };
function dbStart(i){
    var sp = ((UNIT.assess || {}).format || { order:[] }).order[i]; if (!sp) return;
    dbStop(); DBT.end = Date.now() + sp.min * 60000; DBT.who = sp.who;
    DBT.int = setInterval(dbTick, 250); dbTick();
}
function dbStop(){ if (DBT.int) clearInterval(DBT.int); DBT.int = null; DBT.end = null; }
function dbTick(){
    var el = $('db-clock'), who = $('db-who');
    if (!el) { dbStop(); return; }
    if (!DBT.end) return;
    var left = Math.round((DBT.end - Date.now()) / 1000);
    el.className = 'db-clock' + (left <= 0 ? ' over' : left <= 30 ? ' warn' : ' on');
    if (left <= -15) { el.textContent = 'Stop'; if (who) who.textContent = DBT.who + ' — time is up. Thank you.'; dbStop(); return; }
    el.textContent = left <= 0 ? 'Time' : Math.floor(left / 60) + ':' + pad2(left % 60);

}

function loadPptx(cb, idx){

    if (window.PptxGenJS) return cb();
    if (idx >= PPTX_SRC.length) { showNotification('Could not load the PowerPoint builder — check your internet connection', 'bg-red-600'); return; }
    var sc = document.createElement('script');

/* A diagram is an inline SVG on the site. PowerPoint and Google Slides are
   happier with a picture, so each one is drawn to a PNG first.             */
function svgSize(svg){
    var m = /viewBox="\s*[\d.\-]+\s+[\d.\-]+\s+([\d.]+)\s+([\d.]+)"/.exec(svg);
    return m ? { w:Number(m[1]), h:Number(m[2]) } : { w:800, h:450 };
}
function svgToPng(svg, px){
    return new Promise(function(resolve){
        try {
            var sz = svgSize(svg), W = px || 1600, H = Math.round(W * sz.h / sz.w);
            var src = svg.replace(/<svg /, '<svg width="' + W + '" height="' + H + '" ').replace(/currentColor/g, '#0f172a');
            if (src.indexOf('xmlns=') < 0) src = src.replace(/<svg /, '<svg xmlns="http://www.w3.org/2000/svg" ');
            var img = new Image();
            img.onload = function(){
                try {
                    var c = document.createElement('canvas'); c.width = W; c.height = H;
                    var g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H);
                    resolve({ data:c.toDataURL('image/png'), w:W, h:H });
                } catch (e) { resolve(null); }
            };
            img.onerror = function(){ resolve(null); };
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
        } catch (e) { resolve(null); }
    });
}

function deckPics(n){
    var ids = [];
    (SLIDES[n] || []).forEach(function(s){ if (s.k === 'pic' && FIGS[s.fig] && ids.indexOf(s.fig) < 0) ids.push(s.fig); });
    return Promise.all(ids.map(function(id){ return svgToPng(FIGS[id], 1600); })).then(function(arr){

   ========================================================================= */

/* ---------- answers: read off the block itself ---------- */
function blockAnswer(b){
    var out = '';
    if (b.t === 'match' && b.key) {
        out = b.key.map(function(k, i){ return (i + 1) + '\u2009' + LETTER(k); }).join(' \u00b7 ');
    } else if (b.t === 'mcq' && b.a !== undefined && b.opts) {
        out = '<strong>' + LETTER(b.a) + '</strong> \u2014 ' + b.opts[b.a];
    } else if (b.t === 'pick' && b.key) {
        var codes = (b.codes || []).map(function(c){ return c[0]; });
        out = codes.map(function(c, ci){
            var hits = []; b.key.forEach(function(k, i){ if (k === c) hits.push(i + 1); });
            return '<strong>' + esc(b.codes[ci][1]) + ' (' + esc(c) + '):</strong> ' + (hits.length ? hits.join(', ') : 'none');
        }).join(' \u00b7 ');
    } else if (b.t === 'passage' && b.key) {
        var groups = {}, order = [];
        b.key.forEach(function(k, i){ if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(i + 1); });
        var names = b.keyNames || { F:'Facts', O:'Opinions' };
        out = order.map(function(k){ return '<strong>' + esc(names[k] || k) + ':</strong> ' + (groups[k].length === 1 ? 'sentence ' : 'sentences ') + groups[k].join(', '); }).join(' \u00b7 ');
    }
    if (b.ans) out += (out ? '<br>' : '') + b.ans;
    return out;
}
function blockLabel(b){
    return (b.q ? b.q + '. ' : '') + (b.label || '') + (b.marks ? ' <span class="wmk">[' + b.marks + (b.marks === 1 ? ' mark' : ' marks') + ']</span>' : '');
}

/* ---------- worksheet HTML ---------- */
function wsBlockHTML(b){
    var h = '', lab = blockLabel(b);
    function lines(n, cls){ var out = ''; for (var i = 0; i < n; i++) out += '<div class="wl ' + (cls || '') + '"></div>'; return out; }
    switch (b.t) {
    case 'text': return '<p class="wt">' + b.body + '</p>';
    case 'html': return '<div class="wb wfree">' + b.body + '</div>';
    case 'head': return '<div class="wsec">' + b.body + (b.marks ? ' <span class="wmk">[' + b.marks + ' marks]</span>' : '') + '</div>';
    case 'lines':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>';
        if (b.hint) h += '<div class="whint">' + b.hint + '</div>';
        if (b.fields) h += b.fields.map(function(f){ return '<div class="wfield">' + f + '</div>'; }).join('');
        return h + lines(b.n || 0) + '</div>';
    case 'q':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>';
        if (b.hint) h += '<div class="whint">' + b.hint + '</div>';
        if (b.fields) h += b.fields.map(function(f){ return '<div class="wsub">' + f + '</div>' + lines(b.flines || 2); }).join('');
        else for (var i = 1; i <= (b.n || 0); i++) h += '<div class="wnum">' + i + '.</div>' + lines(b.lines || 2);
        return h + '</div>';
    case 'table': {
        var w = b.w || [], total = w.reduce(function(a, c){ return a + c; }, 0) || b.head.length;
        h = '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '') + '<table class="wtab"><thead><tr>'
          + b.head.map(function(c, i){
              var pc = w.length ? (w[i] / total * 100).toFixed(1) + '%' : (100 / b.head.length) + '%';
              return '<th style="width:' + pc + '">' + c + '</th>';
            }).join('') + '</tr></thead><tbody>';
        var cell = b.h ? '<td style="height:' + b.h + '"></td>' : '<td></td>';
        if (b.body) h += b.body.map(function(r){
            return '<tr>' + r.map(function(c, i){
                if (c === '' || c === null) return cell;
                return i === 0 && b.rowHead !== false ? '<th class="wrow" style="width:auto">' + c + '</th>' : '<td class="wfill"' + (b.h ? ' style="height:' + b.h + '"' : '') + '>' + c + '</td>';
            }).join('') + '</tr>';
        }).join('');
        if (b.fixed) h += b.fixed.map(function(f){ return '<tr><th class="wrow">' + f + '</th>' + new Array(b.head.length).join(cell) + '</tr>'; }).join('');
        for (var r = 0; r < (b.rows || 0); r++) h += '<tr>' + new Array(b.head.length + 1).join(cell) + '</tr>';
        return h + '</tbody></table></div>';
    }
    case 'grid':
        return '<div class="wb"><div class="wlab">' + lab + '</div><table class="wtab"><thead><tr><th style="width:26%"></th>'
          + b.cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>'
          + b.rows.map(function(r){ return '<tr><th class="wrow">' + r + '</th>' + new Array(b.cols.length + 1).join('<td></td>') + '</tr>'; }).join('')
          + '</tbody></table></div>';
    case 'tchart':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '') + '<table class="wtab wtchart"><thead><tr>'
          + '<th style="width:50%">' + b.left + '</th><th style="width:50%">' + b.right + '</th></tr></thead><tbody>';
        for (var t = 0; t < b.rows; t++) h += '<tr><td' + (b.h ? ' style="height:' + b.h + '"' : '') + '></td><td></td></tr>';
        return h + '</tbody></table></div>';
    case 'steps':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>';
        for (var s2 = 1; s2 <= b.n; s2++) {
            h += '<div class="wstep"><span class="wstepn">' + (b.names ? b.names[s2 - 1] : s2) + '</span><span class="wstepbox"' + (b.h ? ' style="height:' + b.h + '"' : '') + '></span></div>';
            if (s2 < b.n) h += '<div class="warrow">\u2193</div>';
        }
        return h + '</div>';
    case 'scale':
        return '<div class="wb"><div class="wlab">' + lab + '</div>'
            + '<div class="wscale"><span>' + b.left + '</span><span>' + b.right + '</span></div><div class="wscaleline"></div>'
            + '<div class="whint" style="margin-top:.5rem">' + (b.hint || 'Mark your X on the line, then explain in one sentence.') + '</div><div class="wl"></div></div>';
    case 'match':
        return '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '')
            + '<table class="wtab wmatch"><thead><tr><th style="width:27%">' + (b.heads ? b.heads[0] : 'Term') + '</th><th style="width:9%">Letter</th><th>' + (b.heads ? b.heads[1] : 'Meanings') + '</th></tr></thead><tbody>'
            + b.left.map(function(l, i){
                return '<tr><th class="wrow" style="width:auto">' + (i + 1) + '. ' + l + '</th><td></td><td class="wfill">' + (b.right[i] !== undefined ? '<strong>' + LETTER(i) + '</strong> &nbsp;' + b.right[i] : '') + '</td></tr>';
              }).join('')
            + b.right.slice(b.left.length).map(function(r, j){ return '<tr><th class="wrow" style="width:auto"></th><td></td><td class="wfill"><strong>' + LETTER(b.left.length + j) + '</strong> &nbsp;' + r + '</td></tr>'; }).join('')
            + '</tbody></table></div>';
    case 'mcq':
        return '<div class="wb"><div class="wlab">' + lab + '</div><div class="wmcq' + (b.inline ? ' inline' : '') + '">'
            + b.opts.map(function(o, i){ return '<span><span class="wcirc">' + LETTER(i) + '</span> ' + o + '</span>'; }).join('') + '</div></div>';
    case 'pick':
        return '<div class="wb"><div class="wlab">' + lab + '</div>'
            + '<div class="whint">' + (b.hint ? b.hint + ' ' : '') + 'Write ' + (b.codes || []).map(function(c){ return '<strong>' + c[0] + '</strong> for ' + c[1]; }).join(', ').replace(/, ([^,]*)$/, ' or $1') + ' in each box.</div>'
            + '<div class="wpick c' + (b.cols || 2) + '">' + b.items.map(function(x, i){ return '<div><span class="wbox"></span><span><span class="wpn">' + (i + 1) + '</span> ' + x + '</span></div>'; }).join('') + '</div></div>';
    case 'passage':
        return '<div class="wb wpass">' + (b.label ? '<div class="wlab">' + lab + '</div>' : '')
            + '<div class="wart">' + (b.kick ? '<div class="wartk">' + b.kick + '</div>' : '') + '<div class="warth">' + b.title + '</div>' + (b.by ? '<div class="wartb">' + b.by + '</div>' : '')
            + '<p>' + b.sents.map(function(s, i){ return (b.paras && b.paras.indexOf(i) > -1 ? '</p><p>' : '') + '<sup>' + (i + 1) + '</sup>' + s; }).join(' ') + '</p></div></div>';
    case 'fig':
        return '<div class="wb wfig"' + (b.w ? ' style="max-width:' + b.w + ';margin-left:auto;margin-right:auto"' : '') + '>' + (b.label ? '<div class="wlab">' + lab + '</div>' : '')
            + (FIGS[b.fig] || '') + (b.cap ? '<div class="wcap">' + b.cap + '</div>' : '') + '</div>';
    case 'box':
        return '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '')
            + '<div class="wdraw" style="height:' + (b.h || '60mm') + '">' + (b.inner || '') + '</div></div>';
    case 'check':
        return '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '')
            + '<div class="wcheck c' + (b.cols || 1) + '">' + b.items.map(function(x){ return '<div><span class="wbox"></span><span>' + x + '</span></div>'; }).join('') + '</div></div>';
    case 'rubric': return '<div class="wb">' + (b.label ? '<div class="wlab">' + lab + '</div>' : '') + rubricTableHTML(b.student !== false) + '</div>';
    case 'break': return '<div style="page-break-before:always"></div>';
    }
    return '';
}

function rubricTableHTML(student){
    var R = (UNIT.assess || {}).rubric; if (!R) return '';
    return '<table class="wtab wrub"><thead><tr><th style="width:19%">' + (student ? 'What we look for' : 'Criterion') + '</th>'
        + R.bands.map(function(b){ return '<th>' + esc(b) + '</th>'; }).join('') + '</tr></thead><tbody>'
        + R.rows.map(function(r){
            return '<tr><th class="wrow" style="width:auto">' + r.name + '</th>' + r.levels.map(function(x){ return '<td class="wfill">' + x + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
}

function printableDoc(bodyHTML, docTitle, fileBase, preview){

        + '<title>' + esc(docTitle) + '</title><style>' + WS_CSS + '</style></head><body' + (preview ? ' class="preview"' : '') + '>'

        +   'var x=new XMLSerializer().serializeToString(sv);'
        +   'x=x.replace(/^<svg([^>]*)>/,function(m,a){a=a.replace(/\\sstyle="[^"]*"/,"").replace(/\\s(width|height)="[^"]*"/g,"");return "<svg"+a+" width=\\""+(w*2)+"\\" height=\\""+(h*2)+"\\">";});'
        +   'var im=new Image();im.onload=function(){try{var c=document.createElement("canvas");c.width=w*2;c.height=h*2;var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);'
        +     'var o=document.createElement("img");o.src=c.toDataURL("image/png");o.width=w;o.height=h;o.style.maxWidth="100%";sv.parentNode.replaceChild(o,sv);}catch(e){}if(--left===0)cb();};'
        +   'im.onerror=function(){if(--left===0)cb();};im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x);});}'
        + 'function dl(){rast(function(){var h=document.documentElement.outerHTML;'
        +   'var b=new Blob(["\\ufeff"+h],{type:"application/msword"});'
        +   'var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=' + JSON.stringify((fileBase || 'document') + '.doc') + ';a.click();});}'
        + 'function gdoc(btn){rast(function(){'

        +   'for(var i=0;i<node.length;i++){wrap.appendChild(node[i].cloneNode(true));}'
        +   'var html="<html><head><meta charset=\\"utf-8\\"><style>"+document.querySelector("style").textContent+"<\\/style><\\/head><body>"+wrap.innerHTML+"<\\/body><\\/html>";'
        +   'function done(){btn.textContent="\\u2713 Copied \\u2014 now paste into Google Docs";'
        +     'setTimeout(function(){window.open("https://docs.new","_blank");},400);'
        +     'setTimeout(function(){btn.textContent="Copy for Google Docs";},6000);}'
        +   'function fallback(){var d=document.createElement("div");d.id="gdoc-stage";'
        +     'd.setAttribute("contenteditable","true");d.innerHTML=wrap.innerHTML;document.body.appendChild(d);'
        +     'var r=document.createRange();r.selectNodeContents(d);var sel=window.getSelection();'
        +     'sel.removeAllRanges();sel.addRange(r);'
        +     'try{document.execCommand("copy");done();}catch(e){btn.textContent="Copy failed \\u2014 select and copy by hand";}'
        +     'sel.removeAllRanges();d.remove();}'
        +   'if(navigator.clipboard&&window.ClipboardItem){'
        +     'try{navigator.clipboard.write([new ClipboardItem({'
        +       '"text/html":new Blob([html],{type:"text/html"}),'
        +       '"text/plain":new Blob([wrap.textContent],{type:"text/plain"})})])'
        +       '.then(done).catch(fallback);}catch(e){fallback();}'
        +   '}else{fallback();}'
        + '});}<\/script>')
        + '</body></html>';

function cardsAnswer(n){
    var c = CARDS[n]; if (!c) return '';
    if (c.ans) return c.ans;
    if (!c.cats) return '';
    var out = [];
    Object.keys(c.cats).forEach(function(k){
        var hits = [];
        (c.groups || []).forEach(function(g){ g.items.forEach(function(x){ if (x.c === k) hits.push(strip(x.t)); }); });
        if (hits.length) out.push('<strong>' + esc(c.cats[k]) + ':</strong> ' + hits.map(esc).join('; ') + '.');
    });
    return out.join('<br>') + (c.ansNote ? '<br><em>' + c.ansNote + '</em>' : '');
}

 "notes": {
  "1": {
   "watch": "Misconception that democracy only means voting for the Prime Minister. Ask: “How can you be democratic in your classroom or local club?” A class vote, a club’s annual meeting and a student council are all democracy at a small scale.",
   "support": "The Google Doc has a pre-selected list of five Waiheke groups and sentence starters for the paragraph. Point students who need it straight to the list rather than an open search.",
   "extend": "Find a second group that does something similar somewhere else in Auckland. What is the same and what is different?",
   "local": "This is an overview lesson: key terms introduced here are covered in full depth in later lessons. The five groups on the doc were checked in October 2026. The Waiheke Volunteer Fire Brigade has no website of its own, so its link is a Gulf News story. Keep the brainstorm photo: Lesson 16’s reflection is a good time to show it again."
  },
  "2": {
   "watch": "Misconception that the national government runs rubbish collection and local parks. Ask: “If the slide is broken at the park, who do you ring?” (The council — through its Report a problem page or phone line.)",
   "support": "Visual support: print the picture cues for services. The mind-map frame on the doc already has four categories with examples, so the job becomes finding two services for each.",
   "extend": "Extension (Q4): find out how the council consults with local iwi. Good places: the council’s Kaupapa Māori page, and Houkura, the Independent Māori Statutory Board.",
   "local": "Talk to your kaiako Māori before teaching the mana whenua slide. The slide says only what public sources say: the council must give Māori a real chance to take part in decisions, and on Waiheke mana whenua include Ngāti Pāoa. Since 1 October 2026 Auckland Council, not Auckland Transport, looks after local roads, footpaths and street lights — older websites still say Auckland Transport."
  },
  "3": {
   "watch": "Misconception that councils get all their money directly from the Prime Minister. Ask: “What bill do homeowners have to pay to the council every year?” (Rates.) Government funding is real, but it is the smallest of the three.",
   "support": "Simplify the numbers: use blocks of 10. On the $1,000 pie, 10% is one block of $100, so 50% is five blocks. For the bar graph, give the scale already drawn (0 to 35 in steps of 5).",
   "extend": "Challenge (Q4): fractions of a real budget. Auckland Council spent $5,133 million on day-to-day running in 2025/26. About how much went on transport (33%)? (About $1,694 million; the real figure was $1,705 million, because 33% is rounded.)",
   "local": "The pie and the bar graph on the slides are made up, so the numbers are easy. The table in Q3 is Auckland Council’s real 2025/26 day-to-day spending, rounded to every $100. The plan asks for a graph of where $100 of rates money goes. Rates are only part of the council’s money (about $48 of every $100), and in Auckland most water charges are billed separately by Watercare, so the graph uses the council’s overall spending as the best guide to where rates money goes. Say so if a student asks. The plan suggests a mock dataset; the real one is used because its numbers are already simple."
  },
  "4": {
   "watch": "Misconception that one side of a debate is completely “wrong”. Ask: “Why might a good person argue against fixing the park right now?” Both sides in the article are reasonable people with real worries.",
   "support": "Provide an audio version of the article (text-to-speech, or read it aloud to a small group) or the bullet-point summary at the end of the doc.",
   "extend": "Find the real 2026 rates news in Links. Which arguments in our article also appear in the real reports? Is anyone quoted who is not in ours?",
   "local": "The $6.16 a week is the council’s own figure ($321 is itself rounded, so $321 ÷ 52 gives $6.17 — a good catch if a student makes it). The two articles are written for this lesson from real 2026 figures: the 7.9% rise, $321 a year for the average home, the City Rail Link’s running cost of about $235 million a year, and the rates cap the Government announced in August 2026. The people quoted are made up. Keep the vote about arguments, not families: some students’ families will be finding rates hard to pay."
  },
  "5": {
   "watch": "Misconception that characters only have one simple trait. Ask: “Could a business owner also care about sports?” Real people hold mixed views: the retiree’s grandchildren might use the centre.",
   "support": "The character cards give each role bullet points of their main concerns. Group students so stronger speakers model the hot seat first; let a nervous student answer with their card in hand.",
   "extend": "Take the hot seat as a new character who is not on the cards — a nurse, a parent of a toddler, a swimming coach — and work out their view on the spot. Or write a question that would make a character’s argument harder to hold.",
   "local": "The $2 million centre and the $100 rise are the unit plan’s scenario, made up. Waiheke has a real version: volunteers have worked for twelve years on a community pool, and a new plan was floated in July 2026 (Gulf News). It returns as one of the debate moots in Lesson 12."
  },
  "6": {
   "watch": "Misconception that quotes in a news story are automatically facts. Ask: “If the newspaper quotes someone saying ‘the council is lazy’, is that a fact or just a fact that they said it?” It is a fact that they said it; what they said is an opinion.",
   "support": "Provide a glossary of emotive words (terrible, best, unfair…): it is in the Google Doc. Students who struggle to find an article use the backup article at the end of the doc.",
   "extend": "Discuss bias in how facts are selected: an article can use only true facts and still lean one way, by choosing which facts to include. Which facts would the other side have added?",
   "local": "The letter in Q2 is made up, but every fact in it is real: twelve years of volunteer work on a Waiheke community pool and the July 2026 plan for the field by Donald Bruce Road (Gulf News), and Auckland’s free swimming for 16 and under and its 8 million visits a year (OurAuckland). The pool is one of the debate moots, so this is useful groundwork."
  },
  "7": {
   "watch": "Misconception that only adults can show civic responsibility. Ask: “What is something a Year 7 student can do this weekend to help the community?”",
   "support": "Provide a writing frame or the storyboard template with pre-drawn boxes and captions. Offer choice in how they present: draw it, or write it as six short paragraphs.",
   "extend": "Add a seventh panel: how could the council or the local board help this idea grow? (A local board grant, a park booking, permission for an event.)",
   "local": "Island examples for the web: Home Grown Waiheke’s community gardens, the Waiheke Resources Trust’s food rescue, beach clean-ups with the Waiheke Marine Project, the volunteer fire brigade, school reading buddies and kapa haka. Several students researched these groups in Lesson 1, so ask them to add what they found."
  },
  "8": {
   "watch": "Misconception that AI’s suggestions are always perfect. Ask: “Did the AI understand our specific local context, or just give a generic answer?” It does not know our skate park, our local board or what happened.",
   "support": "Provide question stems for the draft stage: Who…? What…? Why…? How might we…? Chunk the four steps: show one step at a time and check everyone has finished it before moving on.",
   "extend": "Turn the best two questions into the start of a short written submission to the local board: who you are, what you are asking, and why it matters.",
   "local": "AI level 3, “AI to collaborate”: students use AI to get feedback on work they have already done themselves, check it, and finish the work on their own. The worksheet’s last box is the same three-line AI statement students will complete on their debate speech in Lesson 13, so this is practice for that."
  },
  "9": {
   "watch": "Misconception that change happens instantly. Ask: “How long do you think it took from the first petition to the actual law changing?” (Women’s suffrage: three years and three rounds of petitions. Bastion Point: eleven years. Make It 16: started in 2019, and the voting age is still 18.)",
   "support": "Provide the three case study cards to choose from rather than open internet research. The planner in the Google Doc has the three slide headings ready.",
   "extend": "Compare two examples: which method worked faster, and why? Or find a Waiheke example: the Matiatia marina refused in 2015 after a community campaign, or the 2021 Ngāti Pāoa rāhui on shellfish that became a legal closure.",
   "local": "The video and the Bastion Point story deal with an occupation and arrests. Keep the focus on respectful protest as a protected right, and talk to your kaiako Māori about how you frame it. The School Strike 4 Climate figures are from the Education Gazette (2019). The Zero Carbon Act passed on 7 November 2019 with many groups pushing for it, so say the strikers were part of the push, not the sole cause. The strikes were in school time and schools handled attendance differently: peaceful protest is protected, but missing school is a separate question."
  },
  "10": {
   "watch": "Misconception that social action requires money. Ask: “What resources do we have that cost nothing?” (Our time, our skills, our voices, school equipment we can borrow, permission, posters, whānau and friends.)",
   "support": "Assign specific roles within groups (Timekeeper, Scribe, Researcher, Speaker) to ensure all participate. The template is heavily scaffolded: every box has a sentence starter.",
   "extend": "Add a seventh section: who could help from outside school? A local board grant, a community group from Lesson 1, or the council’s Report a problem page.",
   "local": "This plan is the unit’s formative group assessment, and Lesson 11 swaps plans for feedback. Groups do not have to carry the action out in this unit, but if one is doable — a lunchtime clean-up, a recycling poster campaign — doing it is the best ending. Note the Week 3 homework (an adult’s community group) is a good source of ideas."
  },
  "11": {
   "watch": "Misconception that feedback means something is bad. Ask: “How does feedback make our final result stronger?” Every real plan, like every house, gets checked before it is finished.",
   "support": "Provide the checklist for evaluating plans (Q1): Is there a clear goal? Is it realistic? Students who find comments hard can copy a starter: “I like that…”, “I wonder if…”, “I wonder who…”.",
   "extend": "Give the plan a score out of 10 for how likely it is to work, with one reason. Then write the one question the principal would ask before saying yes.",
   "local": "This lesson finishes the unit’s formative group assessment: the plan plus the feedback. If a group’s plan is ready, consider letting them carry it out — a lunchtime clean-up or a recycling poster week fits between lessons."
  },
  "12": {
   "watch": "Misconception that debaters must personally believe the side they are arguing. Ask: “Why is it a good skill to be able to argue a point you disagree with?” (You understand the other side, you test your own view, and lawyers, councillors and journalists do it every day.)",
   "support": "Provide the pre-researched fact sheets for students who struggle with search engines. Pair strong speakers with stronger researchers inside each team.",
   "extend": "Find one fact that the other team is likely to use, and plan the answer to it (Q4).",
   "local": "Moots A and D come straight from the unit’s rates debate; B is the Government’s 2026 rates cap; C sets user charges against rates (Lesson 3). Moot A (a community pool for Waiheke) is a real local debate, and the 2026 plan puts it on the field in front of the school’s tennis courts, so expect strong views. The unit plan’s example moot, a new youth centre, is kept for practice only."
  },
  "13": {
   "watch": "Misconception that winning the debate is the only goal. Ask: “How did understanding the other side make your own argument stronger?” The rubric rewards evidence, local government knowledge, perspectives and clarity — not winning.",
   "support": "Students who are severely anxious about public speaking may submit a pre-recorded video or take a heavy research and writing role with a smaller speaking part (the one-minute reply). The speech planner gives each role a frame.",
   "extend": "Write a second rebuttal for a point you think the other side might surprise you with. Or prepare one question to ask the other team’s speaker, if your class uses points of information.",
   "local": "The AI statement is the unit plan’s wording, word for word: “What I used AI for:”, “What I checked, and how:”, “What is entirely my own work:”. Students practised it on the Lesson 8 AI check record. A student who did not use AI writes “I did not use AI” on the first line and still completes the other two."
  },
  "14": {
   "watch": "Misconception that winning the debate is the only goal. Ask: “How did understanding the other side make your own argument stronger?” Say it again before the verdicts: the marks are for evidence, local government knowledge, perspectives and clarity.",
   "support": "A student with a pre-recorded speech plays it at their turn. A nervous speaker may read from notes and is marked on content. Seat adjudicators who struggle to write quickly beside a partner and let them tick Q1 together.",
   "extend": "Strong adjudicators can give the oral verdict for a debate, with reasons, before you give yours.",
   "local": "Each debate takes about 20 minutes: 14 minutes of speeches, then a few minutes for adjudicators to finish their sheets and for changeover. If a team is missing a speaker, a teammate can give two speeches, or the debate moves to Lesson 16."
  },
  "15": {
   "watch": "Misconception that winning the debate is the only goal. Ask: “How did understanding the other side make your own argument stronger?” Say it again before the verdicts: the marks are for evidence, local government knowledge, perspectives and clarity.",
   "support": "A student with a pre-recorded speech plays it at their turn. A nervous speaker may read from notes and is marked on content. Seat adjudicators who struggle to write quickly beside a partner and let them tick Q1 together.",
   "extend": "Strong adjudicators can give the oral verdict for a debate, with reasons, before you give yours.",
   "local": "Same shape as Lesson 14. If a debate from either round could not run, or a speaker was away, it moves to Lesson 16. Keep the adjudication sheets from both rounds: in Lesson 16 each team gets the sheets written about them."
  },
  "16": {
   "watch": "Misconception that winning the debate is the only goal. Ask: “How did understanding the other side make your own argument stronger?” It is Q4 of the reflection.",
   "support": "Every question has a starter in the doc. Students who wrote little in the debate can draw on the adjudicators’ sheets about their team for Q5.",
   "extend": "Write the reflection as a short letter to the Waiheke Local Board or to a councillor: what you learned about the issue and what you would ask them to do.",
   "local": "The reflection is part of the summative: it carries most of the “perspectives” row of the rubric. Collect it with the speech planner and AI statement. Mark each student on the marking sheet using the debate scoring sheet, the speech planner and the reflection together."
  }
 },

  "1": "The unit plan’s resource searches were “What is democracy” and a civic responsibility clip marked TEACHER TO CHECK. The Learn Bright video is the best short explainer found, but it is American: preview it before you use it.",

  "10": "The unit plan’s resources were an action plan template search and a school initiative clip marked TEACHER TO CHECK. The template is the Lesson 10 worksheet; no clip is needed for the Connect.",
  "11": "The unit plan’s resources were searches for a peer feedback template and on evaluating a plan. The Lesson 11 Google Doc is both: the checklist and the “I like… I wonder…” record.",

  "structure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 500\" role=\"img\" aria-label=\"Diagram: Aucklanders vote for the Governing Body and for 21 local boards. Together they are Auckland Council.\" style=\"width:100%;height:auto;display:block\"><rect x=\"280\" y=\"14\" width=\"340\" height=\"62\" rx=\"8\" fill=\"#fffbeb\" stroke=\"#8b6508\" stroke-width=\"2\"/><text x=\"450\" y=\"42\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">People who live in Auckland VOTE</text><text x=\"450\" y=\"64\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"middle\">every three years, at the local elections</text><line x1=\"360\" y1=\"80\" x2=\"240\" y2=\"128\" stroke=\"#475569\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"240,128 251.0,128.4 247.7,120.1\" fill=\"#475569\"/><line x1=\"540\" y1=\"80\" x2=\"660\" y2=\"128\" stroke=\"#475569\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"660,128 652.3,120.1 649.0,128.4\" fill=\"#475569\"/><rect x=\"30\" y=\"132\" width=\"400\" height=\"236\" rx=\"8\" fill=\"#eef4fb\" stroke=\"#002066\" stroke-width=\"2\"/><text x=\"230\" y=\"168\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#002066\" text-anchor=\"middle\" font-weight=\"bold\">THE GOVERNING BODY</text><text x=\"230\" y=\"204\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">The mayor + 20 councillors</text><text x=\"230\" y=\"236\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#475569\" text-anchor=\"middle\">Big decisions for ALL of Auckland:</text><text x=\"230\" y=\"262\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">the budget and the rates</text><text x=\"230\" y=\"286\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">main roads, buses, trains and ferries</text><text x=\"230\" y=\"310\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">water, rubbish and recycling</text><text x=\"230\" y=\"334\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">plans for how the city grows</text><rect x=\"470\" y=\"132\" width=\"400\" height=\"236\" rx=\"8\" fill=\"#eefaf4\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"670\" y=\"168\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#0f5f58\" text-anchor=\"middle\" font-weight=\"bold\">21 LOCAL BOARDS</text><text x=\"670\" y=\"204\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">149 members — 5 to 9 on each board</text><text x=\"670\" y=\"236\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#475569\" text-anchor=\"middle\">LOCAL decisions for their own area:</text><text x=\"670\" y=\"262\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">local parks, playgrounds and halls</text><text x=\"670\" y=\"286\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">local streets, parking and speed limits</text><text x=\"670\" y=\"310\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">grants for local groups and events</text><text x=\"670\" y=\"334\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">speaking up for local people</text><line x1=\"670\" y1=\"372\" x2=\"670\" y2=\"404\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"670,404 674.5,394.0 665.5,394.0\" fill=\"#0f766e\"/><rect x=\"470\" y=\"408\" width=\"400\" height=\"78\" rx=\"8\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><text x=\"670\" y=\"440\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"20\" fill=\"#0f5f58\" text-anchor=\"middle\" font-weight=\"bold\">WAIHEKE LOCAL BOARD</text><text x=\"670\" y=\"468\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#0f172a\" text-anchor=\"middle\">5 members — Waiheke and the inner gulf islands</text><rect x=\"30\" y=\"408\" width=\"400\" height=\"78\" rx=\"8\" fill=\"#002066\" stroke=\"#002066\" stroke-width=\"2\"/><text x=\"230\" y=\"440\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#d1e6f6\" text-anchor=\"middle\">Together they are</text><text x=\"230\" y=\"468\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">AUCKLAND COUNCIL</text><line x1=\"430\" y1=\"447\" x2=\"470\" y2=\"447\" stroke=\"#94a3b8\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/></svg>",
  "spectrum": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"Three ways citizens can change a decision: vote (formal), make a submission (formal), respectful protest (advocacy, protected by law)\" style=\"width:100%;height:auto;display:block\"><text x=\"450\" y=\"40\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#002066\" text-anchor=\"middle\" font-weight=\"bold\">How can citizens change a rule or a decision?</text><line x1=\"60\" y1=\"76\" x2=\"820\" y2=\"76\" stroke=\"#94a3b8\" stroke-width=\"4\"/><polygon points=\"840,76 818,66 818,86\" fill=\"#94a3b8\"/><text x=\"60\" y=\"60\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"start\" font-weight=\"bold\">FORMAL — a set process</text><text x=\"800\" y=\"60\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"end\" font-weight=\"bold\">ADVOCACY — speaking up in public</text><rect x=\"30\" y=\"96\" width=\"260\" height=\"190\" rx=\"8\" fill=\"#fff\" stroke=\"#1d4ed8\" stroke-width=\"3\"/><rect x=\"30\" y=\"96\" width=\"260\" height=\"46\" rx=\"8\" fill=\"#1d4ed8\"/><text x=\"160\" y=\"127\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">VOTE</text><text x=\"160\" y=\"172\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#1d4ed8\" text-anchor=\"middle\" font-weight=\"bold\">FORMAL</text><text x=\"160\" y=\"208\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">Choose who makes</text><text x=\"160\" y=\"232\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">the decisions</text><rect x=\"320\" y=\"96\" width=\"260\" height=\"190\" rx=\"8\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><rect x=\"320\" y=\"96\" width=\"260\" height=\"46\" rx=\"8\" fill=\"#0f766e\"/><text x=\"450\" y=\"127\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">SUBMISSION</text><text x=\"450\" y=\"172\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#0f766e\" text-anchor=\"middle\" font-weight=\"bold\">FORMAL</text><text x=\"450\" y=\"208\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">Tell the council what you</text><text x=\"450\" y=\"232\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">think before it decides</text><rect x=\"610\" y=\"96\" width=\"260\" height=\"190\" rx=\"8\" fill=\"#fff\" stroke=\"#b45309\" stroke-width=\"3\"/><rect x=\"610\" y=\"96\" width=\"260\" height=\"46\" rx=\"8\" fill=\"#b45309\"/><text x=\"740\" y=\"127\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">PROTEST</text><text x=\"740\" y=\"172\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#b45309\" text-anchor=\"middle\" font-weight=\"bold\">ADVOCACY · PROTECTED BY LAW</text><text x=\"740\" y=\"208\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">Show in public, peacefully,</text><text x=\"740\" y=\"232\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">that you disagree</text><text x=\"160\" y=\"266\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"middle\" font-style=\"italic\">age 18 and over</text><text x=\"450\" y=\"266\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"middle\" font-style=\"italic\">any age</text><text x=\"740\" y=\"266\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"middle\" font-style=\"italic\">any age — must be peaceful</text><text x=\"450\" y=\"316\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#475569\" text-anchor=\"middle\">Also: a petition to Parliament · speaking at a meeting · writing to your local board · standing for election</text></svg>",
  "made-income": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 480\" role=\"img\" aria-label=\"Pie graph of a made-up council’s income: rates 50 per cent, user charges 25 per cent, government funding 15 per cent, other 10 per cent\" style=\"width:100%;height:auto;display:block\"><path d=\"M330 230 L330.0 55.0 A175 175 0 0 1 330.0 405.0 Z\" fill=\"#2a78d6\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"435\" y=\"238\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">50%</text><path d=\"M330 230 L330.0 405.0 A175 175 0 0 1 155.0 230.0 Z\" fill=\"#eb6834\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"255.75378797541254\" y=\"312.2462120245875\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">25%</text><path d=\"M330 230 L155.0 230.0 A175 175 0 0 1 227.1 88.4 Z\" fill=\"#1baf7a\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"236.44431496022136\" y=\"190.33099752734762\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">15%</text><path d=\"M330 230 L227.1 88.4 A175 175 0 0 1 330.0 55.0 Z\" fill=\"#94a3b8\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"297.5532155906305\" y=\"138.1390657890089\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"24\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">10%</text><text x=\"450\" y=\"448\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"17\" fill=\"#002066\" text-anchor=\"middle\" font-weight=\"bold\">Where a made-up council gets its money</text><text x=\"450\" y=\"470\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#8b6508\" text-anchor=\"middle\" font-weight=\"bold\">Made up for this lesson. Auckland’s real figures are on the Lesson 3 worksheet.</text><rect x=\"580\" y=\"92\" width=\"30\" height=\"30\" rx=\"4\" fill=\"#2a78d6\"/><text x=\"624\" y=\"106\" font-family=   "made-budget": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 420\" role=\"img\" aria-label=\"Bar graph of a made-up council budget of 2 million dollars: Water and pipes 30 per cent, Roads and footpaths 25 per cent, Parks and playgrounds 15 per cent, Rubbish and recycling 10 per cent, Libraries 10 per cent, Other 10 per cent\" style=\"width:100%;height:auto;display:block\"><text x=\"450\" y=\"30\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#002066\" text-anchor=\"middle\" font-weight=\"bold\">A made-up council spends $2,000,000 a year. Where does it go?</text><line x1=\"260\" y1=\"48\" x2=\"260\" y2=\"366\" stroke=\"#e2e8f0\" stroke-width=\"2\"/><text x=\"260\" y=\"388\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"middle\">0%</text><line x1=\"346.6666666666667\" y1=\"48\" x2=\"346.6666666666667\" y2=\"366\" stroke=\"#e2e8f0\" stroke-width=\"1.2\"/><text x=\"346.6666666666667\" y=\"388\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"middle\">5%</text><line x1=\"433.33333333333337\" y1=\"48\" x2=\"433.33333333333337\" y2=\"366\" stroke=\"#e2e8f0\" stroke-width=\"1.2\"/><text x=\"433.33333333333337\" y=\"388\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"middle\">10%</text><line x1=\"520\" y1=\"48\" x2=\"520\" y2=\"366\" stroke=\"#e2e8f0\" stroke-width=\"1.2\"/><text x=\"520\" y=\"388\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"middle\">15%</text><line x1=\"606.6666666666667\" y1=\"48\" x2=\"606.6666666666667\" y2=\"366\" stroke=\"#e2e8f0\" stroke-width=\"1.2\"/><text x=\"606.6666666666667\" y=\"388\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"middle\">20%</text><line x1=\"693.3333333333333\" y1=\"48\" x2=\"693.3333333333333\" y2=\"366\" stroke=\"#e2e8f0\" stroke-width=\"1.2\"/><text x=\"693.3333333 f\" font-size=\"19\" fill=\"#002066\" text-anchor=\"start\" font-weight=\"bold\">10%</text><text x=\"246\" y=\"294\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"17\" fill=\"#0f172a\" text-anchor=\"end\" font-weight=\"bold\">Libraries</text><path d=\"M260 270 h169.33333333333334 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-169.33333333333334 z\" fill=\"#4a3aa7\"/><text x=\"443.33333333333337\" y=\"294\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#002066\" text-anchor=\"start\" font-weight=\"bold\">10%</text><text x=\"246\" y=\"346\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"17\" fill=\"#0f172a\" text-anchor=\"end\" font-weight=\"bold\">Other</text><path d=\"M260 322 h169.33333333333334 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-169.33333333333334 z\" fill=\"#4a3aa7\"/><text x=\"443.33333333333337\" y=\"346\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"19\" fill=\"#002066\" text-anchor=\"start\" font-weight=\"bold\">10%</text><text x=\"450\" y=\"416\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#8b6508\" text-anchor=\"middle\" font-weight=\"bold\">Made up for this lesson — the numbers are chosen to be easy to work with.</text></svg>",

  "brief": "<p>The unit plan’s summative: a <strong>formal debate on a local issue</strong> (rates against services), over four periods — prep finalisation, conducting debates, peer evaluation and final reflections. The plan judges it on the use of factual evidence, understanding of local government, and clarity; the site adds a fourth row, <strong>perspectives</strong>, from the practice the plan names for this assessment (identify values and perspectives) and from the final reflection. The plan marks it “Example Assessment — Teacher to refine/adapt”; everything here is written so you can use it as it is, or change it.</p><p>The class works in <strong>eight teams of three or four</strong>, two teams to a debate. Lessons 14 and 15 run <strong>two debates each</strong> (about 20 minutes per debate), and Lesson 16 takes any debate or speaker who missed out. Everyone not debating is an <strong>adjudicator</strong> on the peer adjudication sheet.</p>",

 "planIntro": "This printable plan is built from the WHS Year 7 Civics unit plan (2027): 16 lessons (12 core + 4 assessment), Term 3, 60-minute lessons. Every lesson keeps the plan’s learning intention, its two success criteria (a third is added to each core lesson; the plan gives one learning intention for Lessons 13–16, so their criteria are written for each lesson), device tag, retrieval question, Connect / I Do / We Do / You Do / Review, differentiation and “watch for”, and adds the resources the plan asked for: slides, worksheets and Google Docs, card sets, answer keys and links.",
 "teacherWarnings": [
  "<strong>Devices and Google Docs.</strong> Every worksheet works as a Google Doc: open it, press <em>Copy for Google Docs</em>, paste into a new doc and assign a copy to each student. Each one also prints for students without a device. The slides say “turn it in on Google Classroom”; if your class uses something else, change the wording once in the SITE settings at the top of the file.",
  "<strong>AI (Lessons 8 and 13).</strong> Most Year 7 students are under 13. Check that their school accounts can use Gemini and what your school’s AI rules allow before Lesson 8. If they cannot, run the AI step on the projector with your own account: the lesson still works.",
  "<strong>Council facts go out of date.</strong> Rates change every July, and the people change at each election. The figures here were correct in October 2026: a 7.9% rise for 2026/27 and an average bill of $4,378. The Government’s rates cap (Moot B) was a bill that had passed its first reading in September 2026, before the 7 November 2026 general election — check what happened to it before Lessons 4 and 12.",
  "<strong>Roads changed hands on 1 October 2026.</strong> Auckland Council now looks after local roads, footpaths and street lights; Auckland Transport runs buses, trains and ferries. Older websites still say otherwise.",
  "<strong>Moot A is a live local issue.</strong> The 2026 plan for a Waiheke community pool puts it on the field in front of the high school’s tennis courts, and some families will have strong views or be involved. Keep the debate about arguments and evidence.",
  "<strong>Made-up materials are labelled.</strong> The Lesson 4 and 6 articles and letters, the $2 million sports centre (the plan’s scenario), the closed skate park (the plan’s mock issue) and the made-up council charts in Lesson 3 are all marked as made up on the page. The numbers inside them are real unless they say otherwise.",
  "<strong>Videos</strong> were confirmed by title and channel only — preview each one. The plan marks the Lesson 12 debate clip TEACHER TO CHECK, so it is yours to choose. YouTube will not play inside the page if you open the file straight from your computer; the slide then opens YouTube instead.",
  "<strong>Talk to your kaiako Māori</strong> before Lesson 2 (mana whenua and the council) and Lesson 9 (Bastion Point). The site says only what public sources say.",
  "<strong>The Waiheke Local Board members’ names</strong> (Resources, “Where the facts and figures come from”) come from secondary sources — confirm them on the board’s own page.",
  "<strong>The assessment is the plan’s example</strong>, marked “Teacher to refine/adapt”. The moots, teams, rubric and sheets are written in full so you can use them as they are or change them."
 ],
 "teacherSections": [
  {
   "title": "Knowledge and practices",
   "body": "<p><strong>Knowledge.</strong> Democracies depend on active participation by people taking civic responsibility in local communities informally and formally (Lessons 1, 7, 11). Local governments make decisions, provide services (parks, water, rubbish), and are paid for by rates, user charges and government funding (Lessons 2, 3). Community members get involved in decision-making and volunteering; local councils are elected and maintain relationships with iwi, businesses and communities (Lessons 2, 5, 10). Debates exist about rates rises versus restricting council spending (Lessons 4, 12). People demonstrate civic responsibility socially and culturally — Polyfest, volunteering, community gardening (Lesson 7). Informed citizenship includes critical thinking about sources, fact versus opinion, and participating: listening, attending hui, voting, respectful protest (Lessons 6, 8, 9).</p><p><strong>Practices.</strong> Think conceptually (1, 7) · Frame questions (2, 8) · Process information (3, 4, 6, 12) · Identify values and perspectives (5, 13–16) · Communicate findings (9, 12–16) · Design, implement and evaluate social action (10, 11).</p><p><strong>Connections.</strong> Builds on earlier explorations of rules, fairness and basic community roles from primary years. Prepares students for Year 9 and 10 studies on national government systems, global citizenship and human rights.</p>"
  },
  {
   "title": "Curriculum integration",
   "body": "<p><strong>Literacy.</strong> Explicit teaching of disciplinary reading strategies: distinguishing between fact and opinion in media texts (Lesson 6, tagged Literacy) and summarising arguments from news articles (Lesson 4).</p><p><strong>Numeracy.</strong> Explicit teaching of interpreting financial data: percentages, calculating basic local government funding breakdowns, and reading budget charts (Lesson 3, tagged Numeracy).</p><p><strong>Mātauranga Māori</strong> (blank in the plan — suggested). Lesson 2: mana whenua, the council’s duty to give Māori a real chance to take part in decisions, and Houkura (extension). Lesson 7: kapa haka and cultural festivals as civic responsibility. Lesson 9: Bastion Point (Takaparawhau), an occupation that ended in arrests in 1978 but led, through the Waitangi Tribunal, to the land being returned in 1988. To go further, ask your kaiako Māori about inviting a speaker on Ngāti Pāoa’s work on Waiheke, such as the 2021 rāhui on shellfish.</p><p><strong>Localised curriculum — Waiheke</strong> (blank in the plan — suggested). Lesson 1 and 7: island community groups. Lesson 2: the Waiheke Local Board. Lessons 6 and 12: the long-running campaign for a Waiheke community pool (Moot A). The Gulf News is used throughout for local reporting.</p>"
  },
  {
   "title": "Homework",
   "plan": false,
   "body": "<p>Four short homework tasks in Weeks 1–4, word for word from the plan, with parent emails: see the Homework tab. Each is on a slide in the lesson that sets it and on the run sheet of the lesson it is due.</p>"
  },
  {
   "title": "How the pieces line up",
   "body": "<p>The plan asked for slideshows and worksheets that agree with each other. They do because each lesson is written once and everything else is read from it:</p><ul><li><strong>The task slide is the master list.</strong> The where-your-work-goes tiles on the run sheet, the slide of the same name, the printed lesson plan and the table on this page are all read from it.</li><li><strong>The answer key is built from the worksheet.</strong> Each numbered question carries its own answer, so a question cannot be renumbered without its answer moving too. “Check your answers” slides show a short form of the same answer.</li><li><strong>Key-word slides read the glossary</strong>, so a definition is word for word the same on the slide, in Key Words and on the word-wall cards. The plan’s eleven key terms use its own definitions.</li><li><strong>Device tags, retrieval questions and homework</strong> are stored once per lesson and shown on the run sheet, the slides, the lesson plan and the Homework tab.</li><li><strong>The debate draw</strong> (moots, teams and sides) is stored once and read by the team cards’ answer, the debate slides, the scoring sheets and this tab.</li></ul><p>If you edit a lesson in the page source, change it in the one place and the rest follows.</p>"
  },
  {
   "title": "How this differs from the student sites",
   "plan": false,
   "body": "<p>The Year 9 and Year 10 unit sites are student sites with a locked teacher tab. This one is the teacher tab turned into the whole site.</p><ul><li><strong>No student view, no passcode, no progress tracking.</strong></li><li><strong>No on-site activities.</strong> Every sorter, quick check and quiz in the plan is a worksheet question, a Google Doc, a printed card set or a quiz slide.</li><li><strong>Every lesson has a timed run sheet</strong> for a 60-minute period, with the plan’s device split shown as a bar.</li><li><strong>Same look, same data shape.</strong> The unit is one object in the page source, so a student version could be built from it later.</li></ul>"
  },
  {
   "title": "Running this site",
   "plan": false,
   "body": "<p><strong>One file, no login.</strong> Open it in any modern browser. Styling and fonts load from the internet, so the page looks plainer on a poor connection but still works.</p><p><strong>Ticks, notes, team names and your name for the parent emails are per device.</strong> They live in that browser on that device. Nothing is collected and nothing is sent anywhere.</p><p><strong>Slideshow keys.</strong> Arrows or space to move, <kbd>N</kbd> for your notes (they show on the projector), <kbd>T</kbd> to start or stop the countdown for the current phase, <kbd>F</kbd> for fullscreen, <kbd>Esc</kbd> to close. Quiz, retrieval and “check your answers” slides hold the answer back until the next press. The debate slides have their own speaker clock.</p><p><strong>Printing.</strong> Every printable opens in its own tab with Print, Download for Word and Copy for Google Docs. Allow pop-ups for this page.</p>"
  },
  {
   "title": "Coverage check",
   "body": "<p>From the unit plan: all specified Knowledge and Practices are taught across the unit. Local government roles (L2), funding (L3), debates on rates (L4), civic responsibility (L1, L7), informed citizenship (L6, L8). Conceptual thinking (L1, L7), framing questions (L2, L8), processing information (L3, L4, L6), identifying perspectives (L5), communicating findings (L9, L12), designing and evaluating social action (L10, L11). Overall device balance: about 50%. (Counted from the plan’s own lesson tags it is higher, because all four assessment lessons are tagged ON DEVICE.)</p>"

<!-- ============================= LESSON SLIDESHOW ============================= -->
<div id="deck" class="no-print" role="dialog" aria-modal="true" aria-label="Lesson slideshow">
    <div id="deck-stage" onclick="if(event.target.closest('a,button,iframe'))return;deckNext()"></div>
    <div id="deck-notes" class="hidden"></div>
    <div id="deck-bar">
        <span id="deck-lesson"></span>
        <span id="deck-phase" class="t-ph"></span>
        <span id="deck-modes" aria-label="Where the work on this slide happens"></span>
        <span class="spacer"></span>
        <span id="deck-hint"></span>
        <button class="deck-btn" onclick="deckPrev()" aria-label="Previous slide">&#8249;</button>
        <span id="deck-count"></span>
        <button class="deck-btn" onclick="deckNext()" aria-label="Next slide">&#8250;</button>
        <span class="spacer"></span>
        <button id="deck-timer" class="deck-btn" onclick="deckTimerToggle()" title="Start or stop a countdown for this phase (T)">&#9201;</button>
        <button id="deck-notes-btn" class="deck-btn" onclick="deckToggleNotes()" title="Teacher notes (N) &#8212; these are visible on the projector">Notes</button>
        <button class="deck-btn" onclick="deckFullscreen()" title="Fullscreen (F)">Fullscreen</button>
        <button class="deck-btn" onclick="closeDeck()" title="Exit (Esc)">Exit</button>
    </div>
    <div id="deck-progress-track"><div id="deck-progress" style="width:0%"></div></div>
</div>
